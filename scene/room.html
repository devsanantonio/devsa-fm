<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  html, body { margin: 0; background: #000; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, the room: a night-time San Antonio room drawn in ASCII (the scene is painted
  in greys at low resolution, then every cell becomes a character by brightness), and a
  pixel terminal buddy in headphones nodding to the beat. "Now playing" top right.
  1920x1080, a seamless T-second loop; render(t) draws a frame.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const T = 60, W = 1920, H = 1080, TAU = Math.PI * 2
const TEAL = "#00b2a9", PINK = "#ef426f", ORANGE = "#ff8200"
const BPM = 76                              // 76 beats in 60 s: the loop closes on a beat
const ctx = document.getElementById("c").getContext("2d")
const CELL = 12, COLS = W / CELL, ROWS = H / CELL      // 160 x 90 characters
const RAMP = " .,:;-=+*#%@"

// the scene, painted in greys at character resolution
const sc = document.createElement("canvas"); sc.width = COLS; sc.height = ROWS
const g = sc.getContext("2d", { willReadFrequently: true })
const gray = v => { const c = Math.round(v * 255); return `rgb(${c},${c},${c})` }
function box(x, y, w, h, v) { g.fillStyle = gray(v); g.fillRect(x, y, w, h) }
function frame(x, y, w, h, v) { g.strokeStyle = gray(v); g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1) }

function load_mark() { return new Promise(r => { const i = new Image(); i.onload = () => { sampleMark(i); r() }; i.onerror = r; i.src = (new URLSearchParams(location.search).get("char") === "alt" ? "devsa-alt-logo.svg" : "devsa-logo.svg") }) }

// the City of San Antonio's line icons, recoloured white and drawn into the scene
const ICON_FILES = ["alamo", "tower", "cactus2", "concha", "mission-bell", "guitar", "cowboy-hat", "maracas"]
const ICON = {}
async function loadIcons() {
  for (const n of ICON_FILES) {
    let svg = await (await fetch("icons/" + n + ".svg")).text()
    const vb = svg.match(/viewBox="([^"]+)"/)[1].split(/\s+/).map(Number)
    svg = svg.replace(/#231f20/gi, "#ffffff")
    ICON[n] = { vb, svg }
  }
}
// draw an icon `w` cells wide at grey level v; strokes sized to read at character resolution
const ICON_IMG = {}
function icon(n, x, y, w, v) {
  const key = n + "@" + w
  let im = ICON_IMG[key]
  if (!im) {
    const { vb, svg } = ICON[n], sw = (vb[2] / w) * 1.1
    const s2 = svg.replace(/stroke-width:\s*[^;]+;/g, "").replace(/stroke:\s*#ffffff;/g, `stroke: #ffffff; stroke-width: ${sw}px;`)
    im = new Image(); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s2); ICON_IMG[key] = im
    return
  }
  if (!im.complete) return
  const h = w * ICON[n].vb[3] / ICON[n].vb[2]
  g.save(); g.globalAlpha = v; g.drawImage(im, x, y, w, h); g.restore()
}

function paint(t) {
  box(0, 0, COLS, ROWS, .07)                                  // the wall
  box(0, 72, COLS, ROWS - 72, .13)                            // the floor
  for (let x = 0; x < COLS; x += 8) box(x, 72, 1, ROWS - 72, .09)

  // the window, right: night sky, the Tower of the Americas, downtown, a moon
  const wx = 98, wy = 8, ww = 52, wh = 44
  box(wx, wy, ww, wh, .18)
  g.fillStyle = gray(.95); g.beginPath(); g.arc(wx + 42, wy + 9, 4, 0, TAU); g.fill()
  box(wx + 2, wy + 32, 8, 12, .36); box(wx + 30, wy + 30, 7, 14, .38); box(wx + 39, wy + 34, 11, 10, .34)
  icon("tower", wx + 12, wy + 6, 16, .95)
  const beacon = .5 + .5 * Math.sin(TAU * 15 * t / T)
  box(wx + 20, wy + 5, 1, 1, .3 + .7 * beacon)
  for (let i = 0; i < 7; i++) if ((i * 37 + Math.floor(t / 4)) % 5) box(wx + 3 + (i * 13) % 46, wy + 35 + (i * 7) % 8, 1, 1, .85)
  frame(wx, wy, ww, wh, .55); box(wx + ww / 2, wy, 1, wh, .55); box(wx, wy + wh / 2, ww, 1, .55)
  box(wx - 2, wy + wh, ww + 4, 2, .5)

  // the bookshelf, left: books, then the City's mission bell and maracas on the middle shelf
  const sx = 6, sy = 18
  frame(sx, sy, 34, 54, .5)
  for (let k = 1; k < 4; k++) box(sx, sy + k * 13.5, 34, 1, .5)
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  for (const k of [0, 2, 3]) { let x = sx + 2
    while (x < sx + 30) { const w = 2 + Math.floor(rnd() * 3), h = 6 + Math.floor(rnd() * 6)
      box(x, sy + (k + 1) * 13.5 - h, w, h, .3 + rnd() * .5); x += w + (rnd() < .2 ? 3 : 1) } }
  icon("mission-bell", sx + 3, sy + 14.5, 10, .9)
  icon("maracas", sx + 18, sy + 15, 11, .8)
  icon("cactus2", sx + 21, sy - 12, 10, .85)
  // a guitar leaning against the shelf
  { const gw = 13, gh = gw * ICON.guitar.vb[3] / ICON.guitar.vb[2]; g.save(); g.translate(sx + 35 + gw / 2, 72); g.rotate(-0.12); icon("guitar", -gw / 2, -gh, gw, .85); g.restore() }

  // on the wall: a framed print of the Alamo, and a hat on a hook
  const px = 52, py = 10
  frame(px, py, 36, 26, .55); frame(px + 2, py + 2, 32, 22, .25)
  icon("alamo", px + 5, py + 6, 26, .95)
  { const hw = 15, hh = hw * ICON["cowboy-hat"].vb[3] / ICON["cowboy-hat"].vb[2]; icon("cowboy-hat", sx + 3, sy - hh + .5, hw, .85) }

  // string lights across the top, twinkling
  for (let i = 0; i < 18; i++) {
    const x = 4 + i * 9, y = 3 + Math.sin(i * .9) * 1.2 + (i % 2)
    box(x, y, 1, 1, .35 + .55 * Math.max(0, Math.sin(TAU * (2 + i % 3) * t / T + i)))
  }

  // a desk and a monitor: a prompt and a cursor, then code scrolling
  const dx = 112, dy = 66
  box(dx - 4, dy + 10, 46, 2, .5); box(dx - 2, dy + 12, 2, 12, .4); box(dx + 38, dy + 12, 2, 12, .4)
  frame(dx + 6, dy - 14, 26, 20, .6); box(dx + 18, dy + 6, 2, 4, .5)
  g.strokeStyle = gray(.85); g.lineWidth = 1; g.beginPath(); g.moveTo(dx + 9, dy - 11); g.lineTo(dx + 12, dy - 9); g.lineTo(dx + 9, dy - 7); g.stroke()
  if (Math.floor(t) % 2 === 0) box(dx + 13, dy - 7, 4, 1, .85)
  const scroll = Math.floor(t * 2)
  for (let r = 0; r < 3; r++) { const len = 4 + ((r + scroll) * 7) % 15; box(dx + 9, dy - 4 + r * 3, Math.min(len, 20), 1, .5 + (r % 2) * .2) }
  // coffee with steam, and a concha
  box(dx + 1, dy + 6, 3, 4, .6)
  for (let k = 0; k < 3; k++) { const u = ((t / T) * 12 + k / 3) % 1; box(dx + 2 + Math.round(Math.sin(u * 6) * .8), dy + 5 - Math.round(u * 6), 1, 1, .5 * (1 - u)) }
  icon("concha", dx + 32, dy + 4, 7, .8)

  // a rug under the buddy
  g.fillStyle = gray(.2); g.beginPath(); g.ellipse(COLS / 2 - 8, 82, 22, 4, 0, 0, TAU); g.fill()
}

// the character: the DEVSA mark itself, sampled from devsa-logo.svg onto a pixel grid
// (so its shape is the logo's own), with headphones and feet added around it. The
// cursor bar blinks like a terminal. The window is drawn dark grey instead of black so
// it reads against the dark room.
const GW = 44, GH = 33                                  // the logo is 735.7 x 551.8: 4:3
let MARK = null
const PIXEL_MARK = [
  ".tttttt.pppppppp.oooooo.",
  "ttttttt.pppppppp.ooooooo",
  "LLLLLLLLLLLLLLLLLLLLLLLL",
  "LkkkkkkkkkkkkkkkkkkkkkkL",
  "LkkwwwkkkkkkwwwwkkkwkkkL",
  "LkkkwwwkkkkwkkkkkkwkwkkL",
  "LkkkkwwwkkkwkkkkkwkkkwkL",
  "LkkkkkwwwkkkwwwkkwkkkwkL",
  "LkkkkkkwwwkkkkkwkwwwwwkL",
  "LkkkkkwwwkkkkkkwkwkkkwkL",
  "LkkkkwwwkkkwwwwkkwkkkwkL",
  "LkkkwwwkkkkkkkkkkkkkkkkL",
  "LkkwwwkkkkkwwwwwwwwwwwkL",
  "LkkkkkkkkkkwwwwwwwwwwwkL",
  "LkkkkkkkkkkkkkkkkkkkkkkL",
  "LkkkkkkkkkkkkkkkkkkkkkkL",
  ".LkkkkkkkkkkkkkkkkkkkkL.",
  "..LLLLLLLLLLLLLLLLLLLL..",
]                                         // GH rows of GW cells: palette keys
const MPAL = { L: "#eeeeee", k: "#1c1c1c", w: "#eeeeee", t: TEAL, p: PINK, o: ORANGE }
function sampleMark(img) {
  const c = document.createElement("canvas"); c.width = GW * 8; c.height = GH * 8
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, c.width, c.height)
  const d = x.getImageData(0, 0, c.width, c.height).data
  const ref = { k: [0, 0, 0], w: [238, 238, 238], t: [0, 178, 169], p: [239, 66, 111], o: [255, 130, 0] }
  MARK = []
  for (let r = 0; r < GH; r++) { let row = ""
    for (let q = 0; q < GW; q++) {
      // the cell's centre pixel decides it
      const i = ((r * 8 + 4) * c.width + q * 8 + 4) * 4
      if (d[i + 3] < 128) { row += "."; continue }
      let best = ".", bd = 1e9
      // only the tab row may be coloured; below it a cell is the window or a glyph
      const keys = r < GH * 0.18 ? Object.keys(ref) : ["k", "w"]
      for (const kk of keys) { const [R, G, B] = ref[kk]; const dd = (d[i] - R) ** 2 + (d[i + 1] - G) ** 2 + (d[i + 2] - B) ** 2; if (dd < bd) { bd = dd; best = kk } }
      row += best }
    MARK.push(row) }
}
// which mark cells are the cursor bar (they blink): the light cells in the bottom third, right half
const isCursor = (r, q) => r >= GH * 0.7 && q >= GW * 0.45
function buddy(t) {
  if (new URLSearchParams(location.search).get("char") === "pixel") return buddyPixel(t)
  if (!MARK) return
  const beat = (t * BPM / 60) % 1
  const bob = Math.round(Math.pow(Math.sin(beat * Math.PI), 2) * 10)
  const cursorOn = Math.floor(t * 2) % 2 === 0
  const px = 7, mw = GW * px, mh = GH * px
  const bx = Math.round(W / 2 - mw / 2 - 96), by = 1004 - 5 * px - mh       // feet below
  const y0 = by + bob
  // headphones: a band over the top, cups against the sides
  ctx.fillStyle = "#d9d9d9"
  const k = GW / 32, band = [[6, 26, -5], [4, 6, -4], [26, 28, -4], [3, 4, -3], [28, 29, -3], [2, 3, -2], [29, 30, -2]].map(([a, b, y]) => [Math.round(a * k), Math.round(b * k), Math.round(y * k)])
  for (const [a0, a1, ry] of band) ctx.fillRect(bx + a0 * px, y0 + ry * px, (a1 - a0) * px, px)
  ctx.fillRect(bx - 3 * px, y0 - 1 * px, 4 * px, 13 * px); ctx.fillRect(bx + mw - px, y0 - 1 * px, 4 * px, 13 * px)
  ctx.fillRect(bx - 2 * px, y0 - 3 * px, 2 * px, 2 * px); ctx.fillRect(bx + mw, y0 - 3 * px, 2 * px, 2 * px)
  // the mark
  MARK.forEach((row, r) => [...row].forEach((ch, q) => {
    if (ch === ".") return
    if (ch === "w" && isCursor(r, q) && !cursorOn) { ctx.fillStyle = MPAL.k } else ctx.fillStyle = MPAL[ch]
    ctx.fillRect(bx + q * px, y0 + r * px, px, px)
  }))
  // feet, on the floor
  ctx.fillStyle = "#1c1c1c"
  for (const fx of [9, 30]) { ctx.fillRect(bx + fx * px, y0 + mh, 5 * px, by + mh + 3 * px - (y0 + mh)); ctx.fillRect(bx + (fx - 1) * px, by + mh + 3 * px, 7 * px, 2 * px) }
}

function buddyPixel(t) {
  const beat = (t * BPM / 60) % 1
  const bob = Math.round(Math.pow(Math.sin(beat * Math.PI), 2) * 10)
  const cursorOn = Math.floor(t * 2) % 2 === 0
  const C = window.CHAR || {}
  const px = C.px || 13, cols = PIXEL_MARK[0].length, rows = PIXEL_MARK.length, mw = cols * px, mh = rows * px
  const sway = C.sway ? C.sway(t) : 0
  const bx = Math.round(C.x != null ? C.x - mw / 2 : W / 2 - mw / 2 - 96), by = (C.y != null ? C.y : 1004 - 4 * px) - mh + sway, y0 = by + bob
  ctx.fillStyle = "#d9d9d9"
  for (const [a0, a1, ry] of [[5, 19, -4], [3, 5, -3], [19, 21, -3], [1, 3, -2], [21, 23, -2], [0, 1, -1], [23, 24, -1]]) ctx.fillRect(bx + a0 * px, y0 + ry * px, (a1 - a0) * px, px)
  ctx.fillRect(bx - 2 * px, y0, 2 * px, 9 * px); ctx.fillRect(bx + mw, y0, 2 * px, 9 * px)
  PIXEL_MARK.forEach((row, r) => [...row].forEach((ch, q) => {
    if (ch === ".") return
    const cur = ch === "w" && (r === 12 || r === 13) && q >= 11
    ctx.fillStyle = cur && !cursorOn ? MPAL.k : MPAL[ch]
    ctx.fillRect(bx + q * px, y0 + r * px, px, px)
  }))
  ctx.fillStyle = "#eeeeee"
  for (const fx of [5, 16]) { ctx.fillRect(bx + fx * px, y0 + mh, 3 * px, by + mh + 3 * px - (y0 + mh)); ctx.fillRect(bx + (fx - 1) * px, by + mh + 3 * px, 5 * px, px) }
}

function render(t) {
  t = ((t % T) + T) % T
  paint(t)
  const d = g.getImageData(0, 0, COLS, ROWS).data
  ctx.fillStyle = "#0c0c0c"; ctx.fillRect(0, 0, W, H)
  ctx.font = `700 ${CELL + 1}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = d[(y * COLS + x) * 4] / 255
    const ch = RAMP[Math.min(RAMP.length - 1, Math.floor(v * RAMP.length))]
    if (ch === " ") continue
    ctx.fillStyle = `rgba(235,235,235,${(.25 + v * .75).toFixed(2)})`
    ctx.fillText(ch, x * CELL + CELL / 2, y * CELL + CELL / 2 + 1)
  }
  buddy(t)

  // now playing, top right; the credit rotates if there are several tracks
  const cr = window.CREDITS && window.CREDITS.length ? window.CREDITS : ['"Almost in F - Tranquillity" by Kevin MacLeod (incompetech.com) · CC BY 4.0']
  const line = cr[Math.floor(t / 15) % cr.length]
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic"
  ctx.font = '500 22px "Geist"'; ctx.fillStyle = "rgba(255,255,255,0.85)"
  ctx.fillText("♪  " + line, W - 60, 70)
  // bottom left: who this is
  ctx.textAlign = "left"; ctx.font = '700 22px "Geist Mono"'; ctx.fillStyle = "rgba(255,255,255,0.8)"
  ctx.letterSpacing = "3px"; ctx.fillText("DEVSA FM  ·  devsa.community", 60, H - 52); ctx.letterSpacing = "0px"
  const tw = 46
  ;[TEAL, PINK, ORANGE].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(60 + i * (tw + 6), H - 40, tw, 6) })
}

window.render = render
window.ready = Promise.all([document.fonts.load('700 20px "Geist Mono"'), document.fonts.load('500 20px "Geist"'), loadIcons(), load_mark()])
  .then(() => { paint(0); return new Promise(r => setTimeout(r, 300)) })
window.ready.then(() => {
  if (new URLSearchParams(location.search).has("still")) return render(8)
  const t0 = performance.now()
  ;(function loop() { render((performance.now() - t0) / 1000); requestAnimationFrame(loop) })()
})
</script>
</body>
</html>
