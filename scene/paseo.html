<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  html, body { margin: 0; background: #0c0c0c; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, the paseo: Agentic Nights at Market Square. Looking down the paseo at night: El Mercado's
  green arcade of round arches on the left, the brick building with its wood-framed windows and iron
  lanterns on the right, the twin-globe lamp post, brick pavers, a big tree at the far end. Papel
  picado strung wall to wall, backlit so the cuts glow: one flag in four is the DEVSA mark, the rest
  cut with >_, { }, >TV, </>. The nearest string of lights is the frontier models' logos, and the
  Discord mark glows on the brick wall.
  The hero is a folding table with a serape cloth: three agents at laptops, each with its status chip
  as on the Agentic Nights poster, and the Linux penguin at the end.
  The walls, floor and tree are ASCII, tinted by material (green arcade, red brick); everything that
  gives light is drawn in colour on top. 1920x1080, a seamless loop: render(t) draws a frame.
  The older market.html is Market Square by day, at Fiesta.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script src="plush.js"></script>
<script src="fmkit.js"></script>
<script>
const { W, H, TAU, CELL, COLS, ROWS, TEAL, PINK, ORANGE, ctx, g, LT, lerp, clamp01, ease, hash, glow, lit, footer, loadImg } = fm

// --- the world: x across, y up, z away; the paseo is 10.8 wide, the eye 1.6 up -------------------
const VX = 960, VY = 420, F = 520, EYE = 1.6, HALF = 5.4, NEAR = 1.1, FAR = 60
const P = (x, y, z) => [VX + x * F / z, VY + (EYE - y) * F / z]
const ARCADE_TOP = 5.6, BRICK_TOP = 3.4

// a tint map beside the grey scene: what each cell is made of, so the characters take its colour
const tm = document.createElement("canvas"); tm.width = COLS; tm.height = ROWS
const tc = tm.getContext("2d", { willReadFrequently: true })
let TINT = null
const MAT = { arcade: "#2f9a78", base: "#2f62b8", warm: "#ffc978", brick: "#b8573c", pavers: "#9c5440", tree: "#3f8150", sky: null }

function poly(c, pts) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath() }
function shape(pts, v, mat) {                              // into the grey scene, and its material into the tint map
  poly(g, pts); g.fillStyle = fm.gray(v); g.fill()
  poly(tc, pts); if (mat) { tc.fillStyle = MAT[mat]; tc.fill() } else { tc.save(); tc.globalCompositeOperation = "destination-out"; tc.fill(); tc.restore() }
}
// a round-headed arch on the left wall, between depths z0 and z1, spring line at y, as a polygon
function archPts(X, z0, z1, y0, ys) {
  const zc = (z0 + z1) / 2, r = (z1 - z0) / 2, pts = [P(X, y0, z0), P(X, ys, z0)]
  for (let i = 1; i < 12; i++) { const a = Math.PI - i / 12 * Math.PI; pts.push(P(X, ys + Math.sin(a) * r, zc + Math.cos(a) * r)) }
  pts.push(P(X, ys, z1), P(X, y0, z1)); return pts
}

function paint(t) {
  g.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0); tc.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0)
  g.fillStyle = fm.gray(.02); g.fillRect(0, 0, W, H); tc.clearRect(0, 0, W, H)
  let st = 5; const sr = () => (st = (st * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 36; i++) { g.fillStyle = fm.gray(.22 + .2 * sr() + .1 * Math.sin(TAU * 3 * t / LT + i)); g.fillRect(VX - 520 + sr() * 1040, sr() * 300, CELL, CELL) }
  // the big tree at the far end, over the paseo
  for (let k = 0; k < 60; k++) {
    const a = hash(k, 3) * TAU, r = Math.sqrt(hash(3, k)), [x, y] = P(Math.cos(a) * r * 4.2, 5.2 + Math.sin(a) * r * 2.6, 26)
    g.fillStyle = fm.gray(.16 + .16 * hash(k, 9)); g.beginPath(); g.arc(x, y, 26 + 16 * hash(k, 5), 0, TAU); g.fill()
    tc.fillStyle = MAT.tree; tc.beginPath(); tc.arc(x, y, 26 + 16 * hash(k, 5), 0, TAU); tc.fill()
  }
  { const [x, y] = P(0, 0, 26), [, top] = P(0, 3.4, 26); shape([[x - 8, y], [x - 8, top], [x + 8, top], [x + 8, y]], .22, "tree") }
  // the pavers: red brick, coursed across, joints running to the far end
  shape([P(-HALF, 0, NEAR), P(HALF, 0, NEAR), P(HALF, 0, FAR), P(-HALF, 0, FAR)], .11, "pavers")
  g.strokeStyle = fm.gray(.24); g.lineWidth = CELL * .8
  for (let z = NEAR; z < FAR; z *= 1.07) { g.beginPath(); g.moveTo(...P(-HALF, 0, z)); g.lineTo(...P(HALF, 0, z)); g.stroke() }
  for (let x = -HALF; x <= HALF; x += .9) { g.beginPath(); g.moveTo(...P(x, 0, NEAR)); g.lineTo(...P(x, 0, FAR)); g.stroke() }
  // El Mercado, left: the green arcade, a blue base, round arches lit warm from the shops inside
  const XL = -HALF
  shape([P(XL, 0, NEAR), P(XL, ARCADE_TOP, NEAR), P(XL, ARCADE_TOP, FAR), P(XL, 0, FAR)], .2, "arcade")
  shape([P(XL, 0, NEAR), P(XL, .5, NEAR), P(XL, .5, FAR), P(XL, 0, FAR)], .26, "base")
  for (let z = 1.3; z < 44; z += 2.5) {
    shape(archPts(XL, z + .35, z + 2.15, 0, 2.2), .62 + .16 * hash(z, 1), "warm")                // the opening
    const ins = archPts(XL, z + .55, z + 1.95, .4, 2.2); poly(g, ins); g.strokeStyle = fm.gray(.34); g.lineWidth = CELL; g.stroke()   // a shop's display inside
  }
  shape([P(XL, ARCADE_TOP - .3, NEAR), P(XL, ARCADE_TOP, NEAR), P(XL, ARCADE_TOP, FAR), P(XL, ARCADE_TOP - .3, FAR)], .34, "arcade")  // the cornice
  // the brick building, right: brick piers, wood-framed windows lit inside, a low roofline
  const XR = HALF
  shape([P(XR, 0, NEAR), P(XR, BRICK_TOP, NEAR), P(XR, BRICK_TOP, FAR), P(XR, 0, FAR)], .17, "brick")
  g.strokeStyle = fm.gray(.26); g.lineWidth = CELL * .7
  for (let y = .3; y < BRICK_TOP; y += .3) { g.beginPath(); g.moveTo(...P(XR, y, NEAR)); g.lineTo(...P(XR, y, FAR)); g.stroke() }   // the courses
  for (let z = 1.6; z < 44; z += 2.7) {
    shape([P(XR, .5, z + .5), P(XR, 2.7, z + .5), P(XR, 2.7, z + 2.4), P(XR, .5, z + 2.4)], .4, "brick")       // the wood frame
    shape([P(XR, .65, z + .62), P(XR, 2.55, z + .62), P(XR, 2.55, z + 2.28), P(XR, .65, z + 2.28)], .6 + .15 * hash(z, 2), "warm")
    g.strokeStyle = fm.gray(.3); g.lineWidth = CELL * .8
    for (const zz of [z + 1.17, z + 1.73]) { g.beginPath(); g.moveTo(...P(XR, .65, zz)); g.lineTo(...P(XR, 2.55, zz)); g.stroke() }   // mullions
    g.beginPath(); g.moveTo(...P(XR, 1.95, z + .62)); g.lineTo(...P(XR, 1.95, z + 2.28)); g.stroke()
  }
  shape([P(XR - .5, BRICK_TOP, NEAR), P(XR, BRICK_TOP - .25, NEAR), P(XR, BRICK_TOP - .25, FAR), P(XR - .5, BRICK_TOP, FAR)], .3, "brick")   // the eave
  g.setTransform(1, 0, 0, 1, 0, 0); tc.setTransform(1, 0, 0, 1, 0, 0)
  TINT = tc.getImageData(0, 0, COLS, ROWS).data
}
const tint = (x, y) => { const i = (y * COLS + x) * 4; return TINT[i + 3] > 40 ? [TINT[i], TINT[i + 1], TINT[i + 2], 0] : null }

// --- light ---------------------------------------------------------------------------------------
function shopLight() {
  lit(() => {
    for (let z = 1.3; z < 30; z += 2.5) { const [x, y] = P(-HALF + .8, .05, z + 1.25); glow(x, y, 420 / z, 120 / z, "rgba(255,190,110,.13)") }
    for (let z = 1.6; z < 30; z += 2.7) { const [x, y] = P(HALF - .8, .05, z + 1.45); glow(x, y, 420 / z, 120 / z, "rgba(255,190,110,.11)") }
  })
}
// the iron lanterns on the brick piers, and the twin-globe lamp post
function lanterns(t) {
  for (let z = 1.6 + 2.7 * 1; z < 24; z += 2.7) {
    const [x, y] = P(HALF - .12, 2.9, z + .2), s = 9 / z
    lit(() => glow(x, y, 26 * s, 26 * s, "rgba(255,200,120,.5)"))
    ctx.fillStyle = "#16130f"; ctx.fillRect(x - 3 * s, y - 6 * s, 6 * s, 12 * s)
    ctx.fillStyle = "#ffd89a"; ctx.fillRect(x - 2 * s, y - 4 * s, 4 * s, 8 * s)
  }
}
const LAMP = [4.2, 3.0]                                    // world x, z
function lampPost() {
  const [x, y] = P(LAMP[0], 0, LAMP[1]), [, top] = P(0, 3.1, LAMP[1]), s = F / LAMP[1]
  lit(() => { for (const d of [-1, 1]) glow(x + d * .38 * s, top - .2 * s, 1.3 * s, 1.3 * s, "rgba(255,232,190,.42)"); glow(x, y, 2.6 * s, .5 * s, "rgba(255,220,170,.22)") })
  ctx.fillStyle = "#1b1d22"
  ctx.beginPath(); ctx.roundRect(x - .18 * s, y - .5 * s, .36 * s, .5 * s, 6); ctx.fill()                          // the base
  ctx.fillRect(x - .055 * s, top, .11 * s, y - top)                                                              // the post
  ctx.fillRect(x - .42 * s, top + .02 * s, .84 * s, .05 * s)                                                     // the crossarm
  for (const d of [-1, 1]) { ctx.fillStyle = "#fff6e2"; ctx.beginPath(); ctx.arc(x + d * .38 * s, top - .2 * s, .17 * s, 0, TAU); ctx.fill() }
}

// --- papel picado: backlit cut paper, the cuts glowing ----------------------------------------
// the DEVSA mark's light shapes (the three tabs, the chevron, SA, the cursor), from devsa-alt-logo.svg:
// on the mark's flags they are cut through the paper, so they glow, the way the mark's light parts do
const MARK_CUTS = new Path2D("M250.28 0H485.25V91.95H250.28z M234.97 0H30.65C13.8 0 0 13.8 0 30.65v61.3h234.97V0zM705.05 0H500.59v91.95H735.7v-61.3C735.7 13.8 721.9 0 705.05 0zM352.52 459.82c0 9.2 6.14 15.34 15.34 15.34h245.23c9.2 0 15.34-6.140 15.34-15.34v-45.99c0-9.2-6.14-15.34-15.34-15.34H367.83c-9.2 0-15.34 6.14-15.34 15.34v45.99h.03zM193.13 320.33l-95.04 95.04c-7.66 7.66-7.66 18.4 0 24.51l27.59 27.59c7.66 7.66 18.4 7.66 24.51 0l134.89-134.89c6.76-5.64 7.710-15.68 2.08-22.43-.62-.76-1.32-1.46-2.08-2.08L150.19 173.18c-6.14-6.14-18.4-6.14-24.51 0l-27.59 27.59c-7.66 6.14-7.66 16.85 0 24.51l95.04 95.04zM370.33 359.62c-11.28-8.54-17.23-20.81-17.830-36.83l49.22 1.13c.5 8.5 4.16 12.83 10.97 12.98 2.5.06 4.63-.48 6.4-1.63 1.76-1.14 2.68-2.96 2.73-5.47.08-3.47-1.73-6.33-5.44-8.58-3.71-2.24-9.49-4.84-17.35-7.81-9.38-3.55-17.13-7-23.24-10.34-6.12-3.34-11.33-8.12-15.63-14.34-4.31-6.22-6.28-14.13-5.92-23.72.22-9.59 2.88-17.71 7.97-24.34 5.09-6.63 11.95-11.58 20.58-14.86 8.63-3.28 18.3-4.8 29.01-4.55 18.07.42 32.34 4.92 42.78 13.51 10.45 8.59 15.77 20.47 15.98 35.63l-49.85-1.15c-.04-4.17-1.02-7.19-2.92-9.04-1.91-1.85-4.25-2.81-7.03-2.87-1.95-.05-3.56.58-4.84 1.87-1.28 1.29-1.95 3.12-2 5.48-.08 3.34 1.7 6.13 5.34 8.37 3.63 2.24 9.45 4.98 17.45 8.23 9.23 3.69 16.84 7.21 22.82 10.54 5.97 3.34 11.12 7.91 15.44 13.71 4.32 5.81 6.38 13.020 6.18 21.64-.21 9.04-2.62 17.09-7.23 24.15-4.62 7.06-11.21 12.51-19.78 16.34-8.58 3.84-18.7 5.62-30.38 5.35-17.66-.41-32.13-4.88-43.41-13.42zM573.28 348.25l-48.5-.28-7.32 21.95-47.88-.28 54.06-145.19 52.61.3 52.18 145.8-48.09-.28-7.07-22.03zm-11.87-30.27l-13.62-40.33-12.68 40.63 26.3-.31z")
const PAPER = [PINK, TEAL, ORANGE, "#ffd166", TEAL, PINK, "#9b5de5", ORANGE, "#7bd88f"]
const CUTS = ["{ }", "star", "</>"]
const STRINGS = [4.4, 5.9, 7.8, 10.4, 14]           // few enough that the arcade and the brick show
function sparkle(x, y, r) {                                // a four-point star, the sign AI products use
  const q = r * .16
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + q, y - q, x + r, y); ctx.quadraticCurveTo(x + q, y + q, x, y + r)
  ctx.quadraticCurveTo(x - q, y + q, x - r, y); ctx.quadraticCurveTo(x - q, y - q, x, y - r); ctx.fill()
}
function flag(x, y, w, h, i, k, sway, near) {
  const mark = i % 4 === 0
  ctx.save(); ctx.translate(x, y); ctx.transform(1, 0, sway, 1, 0, 0)
  ctx.fillStyle = PAPER[(i + k * 2) % PAPER.length]; ctx.globalAlpha = .94
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.lineTo(w / 2, h * .86)
  for (let j = 6; j >= 0; j--) ctx.lineTo(-w / 2 + w * j / 6, h * (j % 2 ? .86 : 1))            // the scalloped hem
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1
  if (near) {
    const CUT = "rgba(255,244,214,.92)"
    ctx.fillStyle = CUT; ctx.shadowColor = "rgba(255,236,190,.8)"; ctx.shadowBlur = w * .1
    if (mark) {                                             // the mark, cut through: its light shapes glow, the paper is its body
      const k2 = w * .58 / 735.7; ctx.save(); ctx.translate(-w * .29, h * .44 - 551.77 * k2 / 2); ctx.scale(k2, k2); ctx.fill(MARK_CUTS); ctx.restore()
    } else {
      const cut = CUTS[(i + k) % CUTS.length]
      if (cut === "star") { sparkle(0, h * .46, w * .2); sparkle(w * .2, h * .3, w * .08) }   // the AI sparkle, and its little one
      else { ctx.font = `700 ${Math.round(w * .3)}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(cut, 0, h * .46) }
    }
    ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,244,214,.7)"
    for (let j = 0; j < 7; j++) {                            // the punched lace: a border of diamonds above, dots below
      const dx = -w * .36 + j * w * .12, d = w * .03
      ctx.beginPath(); ctx.moveTo(dx, h * .07); ctx.lineTo(dx + d, h * .07 + d); ctx.lineTo(dx, h * .07 + 2 * d); ctx.lineTo(dx - d, h * .07 + d); ctx.fill()
      ctx.beginPath(); ctx.arc(dx, h * .8, d * .8, 0, TAU); ctx.fill()
    }
  }
  ctx.restore()
}
function papelPicado(t, from, to = 99) {
  for (let k = STRINGS.length - 1; k >= 0; k--) {
    const z = STRINGS[k]; if (z < from || z >= to) continue
    const n = 13, at = u => P(lerp(-HALF, HALF, u), 4.7 - .55 * Math.sin(u * Math.PI), z)
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = Math.max(1, 4 / z); ctx.beginPath()
    for (let i = 0; i <= 40; i++) { const [x, y] = at(i / 40); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) } ctx.stroke()
    for (let i = 0; i < n; i++) {
      const [x, y] = at((i + .5) / n), w = .62 * F / z, h = .74 * F / z
      const sway = Math.sin(TAU * (t / LT * 8) + i * .9 + k * 1.3) * .1 + .06 * fm.pulseAt(t)
      flag(x, y, w, h, i, k, sway, z < 11)
    }
  }
}

const waits = []

// --- the hero: Lotería. The caller, at the left end of the table, holds each card up, flips it onto the easel
// and calls its verse; the teal and pink agents play tablas and drop a frijol on every match, and Tux plays
// on his laptop. Everything lands on the song's beat (beats-cumbia.json when synced). Ten calls a round; the
// winner rotates, Tux, teal, pink, and the camera zooms onto the winning tabla. Synced, the song holds
// three rounds. The cards are DEVSA's own and the City of San Antonio's icons; original art throughout.
const TABLE = { x0: 500, x1: 1420, back: 772, front: 800 }
const SERAPE = [TEAL, "#141416", PINK, "#ffd166", ORANGE, "#141416", TEAL, PINK, "#7bd88f", ORANGE]
const [PENGUIN, pw] = loadImg("penguin.png"); waits.push(pw)
const [PYSA, yw] = loadImg("pysa-mascot-full.webp"); waits.push(yw)
// the City of San Antonio's line icons, inked onto cards
const ICONS = {}
for (const n of ["tower", "alamo", "sanjose", "taco", "mission-bell", "concha", "jalapeno", "guitar", "cactus"]) waits.push(fetch(`icons/${n}.svg`).then(r => r.ok ? r.text() : "", () => "").then(svg => { if (/viewBox=/.test(svg)) ICONS[n] = svg }))
const INKED = {}
function inked(n, colour) {
  const key = n + colour; if (INKED[key] || !ICONS[n]) return INKED[key]
  const vb = ICONS[n].match(/viewBox="([^"]+)"/)[1].split(/\s+/).map(Number), sw = vb[2] / 60 * 3.2
  const svg = ICONS[n].replace(/#231f20/gi, colour).replace(/stroke-width:\s*[^;]+;/g, "").replace(new RegExp(`stroke:\\s*${colour};`, "gi"), `stroke: ${colour}; stroke-width: ${sw}px;`)
  const im = new Image(); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); im.vb = vb; return (INKED[key] = im)
}
// the deck: DEVSA's own three, and the City of San Antonio's icons brought to life as cards
const DECK = [
  { name: "EL AGENTE", c: TEAL, verse: "El que trabaja mientras duermes" },
  { name: "EL PINGÜINO", c: "#3a86ff", verse: "Frío por fuera, kernel por dentro" },
  { name: "LA TERMINAL", c: "#26282e", verse: "Escribe y se cumple" },
  { name: "LA TORRE", c: PINK, icon: "tower", verse: "Desde arriba se ve todo San Antonio" },
  { name: "EL ÁLAMO", c: ORANGE, icon: "alamo", verse: "El que todos vienen a ver" },
  { name: "LA MISIÓN", c: "#9b5de5", icon: "sanjose", verse: "La reina de las misiones" },
  { name: "EL TACO", c: "#d9961a", icon: "taco", verse: "De desayuno, de lonche y de cena" },
  { name: "LA CAMPANA", c: "#3f8fd6", icon: "mission-bell", verse: "Suena y todos llegan" },
  { name: "LA CONCHA", c: "#e07a98", icon: "concha", verse: "Pan dulce pa'l café de olla" },
  { name: "EL JALAPEÑO", c: "#2e9e5b", icon: "jalapeno", verse: "Pica, pero bien que te gusta" },
  { name: "LA GUITARRA", c: "#b8213f", icon: "guitar", verse: "La que no deja de tocar" },
  { name: "EL NOPAL", c: "#2e9e5b", icon: "cactus", verse: "Aguanta el calor de agosto" },
]
const CALLER = { x: 590, tint: ORANGE, seed: 13 }
// the players, left to right; winners rotate through them by round, Tux first
const PLAYERS = [{ who: "teal", x: 820, tint: TEAL, seed: 3 }, { who: "pink", x: 1040, tint: PINK, seed: 6 }, { who: "tux", x: 1265, tint: "#3a86ff", seed: 9 }]
const WINNERS = [2, 0, 1]
// time, on the beat
const BB = window.BEATS, BEAT = 60 / (BB ? BB.bpm : 76), OFF = BB ? BB.offset : 0
const ROUNDS = Math.max(1, Math.round(fm.T / 55)), R = fm.T / ROUNDS, CALLS = 10
const snap = s => OFF + Math.round((s - OFF) / BEAT) * BEAT
const shuffle = seed => { const o = DECK.map((_, i) => i); let sd = seed; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647
  for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [o[i], o[j]] = [o[j], o[i]] } return o }
function round(r) {                                        // a round's calls, tablas and winner, the same every time it comes round
  const base = r * R, perm = shuffle(4099 + r * 977), order = perm.slice(0, CALLS), [U1, U2] = perm.slice(CALLS)
  const calls = order.map((_, i) => snap(base + R * (6 + 7.6 * i) / 92))
  // only the winner's top row can fill, and only on the last call; every other row holds a card never called
  const W = [order[2], order[9], order[5], order[7], U1, order[1]]
  const A = [order[0], U1, order[4], order[8], order[3], U2], B = [U2, order[6], order[1], order[5], order[9], U1]
  const w = WINNERS[r % WINNERS.length], others = [A, B]
  const cells = PLAYERS.map((_, i) => i === w ? W : others.shift())
  return { r, base, order, calls, cells, w, win: calls[CALLS - 1] + 3 * BEAT, out: base + R * 89.5 / 92, end: base + R }
}
function art(id, a, t) {                                   // a card's picture, centred on 0,0, about a across
  const d = DECK[id]
  if (id === 0) drawPlush(ctx, { x: 0, y: a * .5, s: a / 128, tint: TEAL, number: "", t, seed: 2, mouth: .4 })
  else if (id === 1 && PENGUIN.complete) { const h = a * 1.02, w = h * PENGUIN.width / PENGUIN.height; ctx.imageSmoothingEnabled = false; ctx.drawImage(PENGUIN, -w / 2, -h / 2, w, h); ctx.imageSmoothingEnabled = true }
  else if (id === 2) { ctx.fillStyle = "#16171b"; ctx.beginPath(); ctx.roundRect(-a * .48, -a * .34, a * .96, a * .68, a * .07); ctx.fill()
    ;[PINK, "#ffd166", "#7bd88f"].forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-a * .38 + k * a * .1, -a * .24, a * .03, 0, TAU); ctx.fill() })
    ctx.fillStyle = "#e9f5f4"; ctx.font = `700 ${Math.round(a * .3)}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(">_", 0, a * .06) }
  else { const im = d.icon && inked(d.icon, d.c)
    if (im && im.complete && im.width) { const k = a * 1.2 / Math.max(im.vb[2], im.vb[3]), w = im.vb[2] * k, h = im.vb[3] * k; ctx.drawImage(im, -w / 2, -h / 2, w, h) }
    else if (!ICONS[d.icon]) {                             // without the City's icons (a fresh clone): the noun's initial
      ctx.fillStyle = d.c; ctx.font = `700 ${Math.round(a * .95)}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"
      ctx.fillText(d.name.split(" ").pop()[0], 0, a * .04) } }
}
function card(id, cx, cy, w, t, flipX = 1) {               // a lotería card: cream stock, a coloured border, number, picture, name
  const h = w * 1.5, d = DECK[id]
  ctx.save(); ctx.translate(cx, cy); ctx.scale(flipX, 1)
  ctx.fillStyle = "#f6efdc"; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, w * .06); ctx.fill()
  ctx.strokeStyle = d.c; ctx.lineWidth = Math.max(1, w * .035); ctx.beginPath(); ctx.roundRect(-w * .44, -h * .45, w * .88, h * .9, w * .04); ctx.stroke()
  if (w > 60) {
    ctx.fillStyle = "#2a2622"; ctx.font = `700 ${Math.round(w * .1)}px "Geist Mono"`; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText(String(id + 1), -w * .38, -h * .41)
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `700 ${Math.round(w * .085)}px "Geist Mono"`; ctx.fillText(d.name, 0, h * .36)
  }
  ctx.fillStyle = fm.rgba(d.c === "#26282e" ? "#3a86ff" : d.c, .14); ctx.fillRect(-w * .4, -h * .36, w * .8, h * .64)   // a wash of the card's colour
  ctx.save(); ctx.translate(0, -h * .04); art(id, w * .62, t); ctx.restore()
  ctx.restore()
}
// where the game is at time t
function game(t) {
  const rd = round(Math.min(ROUNDS - 1, Math.floor(t / R)))
  let n = 0; while (n < CALLS && t >= rd.calls[n]) n++
  const k = n - 1, id = k >= 0 ? rd.order[k] : -1, since = k >= 0 ? t - rd.calls[k] : 99
  let shown = -1, shownSince = 0                           // what's on the easel: it lands two beats after the call
  for (let i = n - 1; i >= 0; i--) if (t >= rd.calls[i] + 2 * BEAT) { shown = rd.order[i]; shownSince = t - rd.calls[i] - 2 * BEAT; break }
  return { ...rd, n, id, since, shown, shownSince, won: t >= rd.win }
}
function easel(t, G) {
  const x = 330, y = 610, w = 172
  ctx.strokeStyle = "#6b4a2e"; ctx.lineWidth = 8; ctx.lineCap = "round"
  ctx.beginPath(); ctx.moveTo(x - 60, 935); ctx.lineTo(x, 470); ctx.lineTo(x + 60, 935); ctx.moveTo(x, 480); ctx.lineTo(x + 10, 935); ctx.stroke()
  ctx.fillStyle = "#6b4a2e"; ctx.fillRect(x - 80, y + 128, 160, 9)
  lit(() => glow(x, y, 210, 260, "rgba(255,226,170,.16)"))
  if (G.shown < 0) return
  const flip = Math.min(1, G.shownSince / (BEAT * .6)), sx = Math.max(.04, Math.abs(Math.cos((1 - flip) * Math.PI / 2)))
  card(G.shown, x, y, w, t, sx)
}
function bubble(t, G) {                                    // the call: the card's name and its verse, over the easel
  if (G.id < 0 || G.won) return
  const d = DECK[G.id], next = G.n < CALLS ? G.calls[G.n] - G.calls[G.n - 1] : 4 * BEAT
  const a = clamp01(G.since / .25) * clamp01((next - .3 - G.since) / .3); if (a <= 0) return
  ctx.save(); ctx.globalAlpha = a
  ctx.font = '700 22px "Geist Mono"'; const w1 = ctx.measureText(d.name).width
  ctx.font = '500 18px "Geist"'; const w2 = ctx.measureText(d.verse).width
  const w = Math.max(w1, w2) + 44, tx = 330, x = Math.max(36, tx - w / 2), y = 372, h = 74
  ctx.fillStyle = "rgba(12,14,18,.94)"; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.fill()
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 2; ctx.stroke()
  ctx.fillStyle = "rgba(12,14,18,.94)"; ctx.beginPath(); ctx.moveTo(tx - 14, y + h - 1); ctx.lineTo(tx, y + h + 22); ctx.lineTo(tx + 14, y + h - 1); ctx.fill()
  ctx.strokeStyle = ORANGE; ctx.beginPath(); ctx.moveTo(tx - 14, y + h); ctx.lineTo(tx, y + h + 22); ctx.lineTo(tx + 14, y + h); ctx.stroke()
  ctx.textAlign = "left"; ctx.textBaseline = "middle"
  ctx.font = '700 22px "Geist Mono"'; ctx.fillStyle = "#fff"; ctx.fillText(d.name, x + 22, y + 24)
  ctx.font = '500 18px "Geist"'; ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fillText(d.verse, x + 22, y + 52)
  ctx.restore()
}
// a tabla: six cards, 3 x 2, its bottom edge at (cx, by); `digital` is Tux's, on his laptop screen
const CW = 48, CH = 72, GAP = 5, PAD = 7, TW = 3 * CW + 2 * GAP + 2 * PAD, TH = 2 * CH + GAP + 2 * PAD
function tabla(cells, cx, by, sc, t, G, digital, winRow) {
  ctx.save(); ctx.translate(cx, by); ctx.scale(sc, sc); ctx.translate(-TW / 2, -TH)
  if (digital) { ctx.fillStyle = "#0e1a22"; ctx.beginPath(); ctx.roundRect(-6, -6, TW + 12, TH + 12, 8); ctx.fill(); ctx.strokeStyle = "rgba(0,178,169,.8)"; ctx.lineWidth = 2; ctx.stroke() }
  else { ctx.fillStyle = "#2b2420"; ctx.beginPath(); ctx.roundRect(0, 0, TW, TH, 6); ctx.fill() }
  const fade = 1 - clamp01((t - (G.end - 1)) / .8)
  cells.forEach((id, i) => {
    const x = PAD + (i % 3) * (CW + GAP) + CW / 2, y = PAD + Math.floor(i / 3) * (CH + GAP) + CH / 2
    card(id, x, y, CW, t)
    const k = G.order.indexOf(id)
    if (k >= 0 && k < G.n) {
      const at = G.calls[k] + 3 * BEAT, drop = clamp01((t - at) / (BEAT * .5)); if (drop <= 0) return
      ctx.save(); ctx.globalAlpha = fade; const yy = y + 8 - (1 - drop) * 40
      if (digital) { ctx.fillStyle = "rgba(0,178,169,.35)"; ctx.fillRect(x - CW / 2, y - CH / 2, CW, CH); ctx.fillStyle = TEAL; ctx.beginPath(); ctx.arc(x, yy, 8, 0, TAU); ctx.fill()
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(x - 4, yy); ctx.lineTo(x - 1, yy + 3); ctx.lineTo(x + 4, yy - 3); ctx.stroke() }
      else { ctx.fillStyle = "#5a3a22"; ctx.beginPath(); ctx.ellipse(x, yy, 10, 7, .4, 0, TAU); ctx.fill()
        ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.beginPath(); ctx.ellipse(x - 3, yy - 2, 3, 1.6, .4, 0, TAU); ctx.fill() }
      ctx.restore()
    }
  })
  if (winRow) { ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 4; ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 16; ctx.beginPath(); ctx.roundRect(PAD - 4, PAD - 4, 3 * CW + 2 * GAP + 8, CH + 8, 8); ctx.stroke(); ctx.shadowBlur = 0 }
  ctx.restore()
}
function laptopBase(cx, by) {                              // Tux's laptop: the screen is his tabla, the base on the table
  ctx.fillStyle = "#9aa0aa"; ctx.beginPath(); ctx.moveTo(cx - TW / 2 - 18, by + 4); ctx.lineTo(cx + TW / 2 + 18, by + 4); ctx.lineTo(cx + TW / 2 + 8, by + 14); ctx.lineTo(cx - TW / 2 - 8, by + 14); ctx.fill()
  lit(() => glow(cx, by - TH / 2, 160, 130, "rgba(0,178,169,.14)"))
}
function folding() {
  const { x0, x1, back, front } = TABLE
  ctx.strokeStyle = "#5d6068"; ctx.lineWidth = 8; ctx.lineCap = "round"
  for (const [a, b] of [[x0 + 60, x0 + 140], [x1 - 60, x1 - 140]]) { ctx.beginPath(); ctx.moveTo(a, front + 80); ctx.lineTo(b, 950); ctx.moveTo(b, front + 80); ctx.lineTo(a, 950); ctx.stroke() }
  lit(() => glow((x0 + x1) / 2, 955, 560, 40, "rgba(255,210,150,.14)"))
  ctx.fillStyle = "#e9e4d8"; poly(ctx, [[x0 + 22, back], [x1 - 22, back], [x1, front], [x0, front]]); ctx.fill()
  const top = front, bot = front + 92, sw = (bot - top) / SERAPE.length
  SERAPE.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x0, top + i * sw, x1 - x0, sw + .5) })
  ctx.fillStyle = "rgba(255,255,255,.18)"; for (let i = 0; i < SERAPE.length; i += 3) ctx.fillRect(x0, top + i * sw + sw * .45, x1 - x0, 1.5)
  ctx.strokeStyle = "#e9e4d8"; ctx.lineWidth = 2; ctx.lineCap = "butt"
  for (let x = x0 + 4; x < x1; x += 8) { ctx.beginPath(); ctx.moveTo(x, bot); ctx.lineTo(x + 1, bot + 10); ctx.stroke() }
}
function confetti(t, G) {
  const u = t - G.win; if (u < 0) return
  const a = 1 - clamp01((t - (G.end - 1.2)) / 1.2)
  for (let i = 0; i < 90; i++) {
    const x = 420 + hash(i, 1) * 1080, y = 240 + ((u * (130 + 90 * hash(i, 2)) + hash(i, 3) * 200) % 680)
    ctx.save(); ctx.globalAlpha = a * .9; ctx.translate(x + Math.sin(u * 2 + i) * 14, y); ctx.rotate(u * 3 + i); ctx.fillStyle = PAPER[i % PAPER.length]; ctx.fillRect(-6, -3.5, 12, 7); ctx.restore()
  }
}
function zoom(t, G) {                                      // ¡Lotería!: the winning tabla, brought up close
  if (!G.won || t > G.out) return
  const k = Math.min(ease(clamp01((t - G.win) / .5)), ease(clamp01((G.out - t) / .5)))
  const P0 = PLAYERS[G.w], bx = lerp(P0.x, 960, k), by = lerp(TABLE.back + 6, 760, k), sc = lerp(1, 2.7, k)
  ctx.fillStyle = `rgba(8,8,10,${(.6 * k).toFixed(2)})`; ctx.fillRect(0, 0, W, H)
  if (P0.who === "tux") laptopBase(bx, by)
  tabla(G.cells[G.w], bx, by, sc, t, G, P0.who === "tux", k > .9)
  if (k > .3) {
    const b = Math.min(1, (k - .3) / .5), y = by - TH * sc - 64
    ctx.save(); ctx.translate(960, y); ctx.scale(b, b); ctx.rotate(-.04)
    ctx.fillStyle = P0.tint; ctx.beginPath(); ctx.roundRect(-170, -40, 340, 80, 18); ctx.fill()
    ctx.fillStyle = "#fff"; ctx.font = '700 44px "Geist Mono"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("¡LOTERÍA!", 0, 3)
    ctx.restore()
    if (P0.who === "tux" && PENGUIN.complete) { const h = 120 * b, w = h * PENGUIN.width / PENGUIN.height; ctx.imageSmoothingEnabled = false; ctx.drawImage(PENGUIN, 960 + 190, y - h / 2 - 6 + Math.sin(t * 12) * 4, w, h); ctx.imageSmoothingEnabled = true }
  }
}
function loteria(t) {
  const G = game(t)
  // the caller: holds the card up on the call, then turns and points at the easel as it lands
  const holding = G.id >= 0 && !G.won && G.since < 2 * BEAT, pointing = !holding && G.id >= 0 && !G.won && G.since < 4 * BEAT
  const head = drawPlush(ctx, { x: CALLER.x, y: 800, s: 1.42, tint: CALLER.tint, number: "", t, seed: CALLER.seed, look: pointing ? -6 : -2,
    mouth: holding ? .95 : pointing ? .6 : .3, armsUp: holding, lean: pointing ? -.12 : 0, liftPx: 2 * fm.pulseAt(t) })
  if (holding) card(G.id, CALLER.x, head.headY - 26 + Math.sin(G.since * 9) * 3, 64, t)
  for (const [i, P] of PLAYERS.entries()) {
    const winner = G.won && i === G.w, hop = winner ? Math.abs(Math.sin((t - G.win) * 7)) * 20 : 0
    if (P.who === "tux") { if (PENGUIN.complete && PENGUIN.width) { const h = 150, w = h * PENGUIN.width / PENGUIN.height
        ctx.imageSmoothingEnabled = false; ctx.drawImage(PENGUIN, P.x - w / 2, TABLE.back - TH - h + 34 - hop + Math.sin(t * 2.2) * 2, w, h); ctx.imageSmoothingEnabled = true } }
    else drawPlush(ctx, { x: P.x, y: 712, s: 1.5, tint: P.tint, number: "", t, seed: P.seed, look: winner ? 0 : -2 + Math.sin(t * .8 + P.seed),
      mouth: winner ? 1 : .3, armsUp: winner, liftPx: hop + 2 * fm.pulseAt(t + P.seed * .1) })
  }
  folding()
  for (const [i, P] of PLAYERS.entries()) { if (P.who === "tux") laptopBase(P.x, TABLE.back + 6); tabla(G.cells[i], P.x, TABLE.back + 6, 1, t, G, P.who === "tux") }
  for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? "#efe6cf" : "#e2d7bb"; ctx.beginPath(); ctx.roundRect(640 - i * .6, TABLE.back - 4 - i * 2.4, 46, 10, 2); ctx.fill() }   // the deck
  easel(t, G)
  bubble(t, G)
}
function celebrate(t) { const G = game(t); confetti(t, G); zoom(t, G) }

// --- the conjunto under the lamp post: an agent playing the button accordion side-on, its bellows opening
// and closing on the beat, and PySanAntonio's mascot on guitar, the same height, swaying with it
function accordion(x, y, t, s) {
  const ph = ((t - OFF) / BEAT) % 2, open = .5 + .5 * Math.sin(ph * Math.PI), span = (58 + 46 * open) * s, h = 64 * s
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.06 + .05 * open)
  ctx.fillStyle = "#16171b"; ctx.beginPath(); ctx.roundRect(-12 * s, -h / 2 - 4 * s, 24 * s, h + 8 * s, 4 * s); ctx.fill()        // the treble end, against the body
  ctx.fillStyle = "#f4ead2"; for (let r = 0; r < 5; r++) for (let c = 0; c < 2; c++) { ctx.beginPath(); ctx.arc(-4 * s + c * 8 * s, -h / 2 + 8 * s + r * 12 * s, 2.8 * s, 0, TAU); ctx.fill() }
  const n = 9, pw = span / n
  for (let i = 0; i < n; i++) { const px = 12 * s + i * pw; ctx.fillStyle = i % 2 ? "#b8213f" : PINK
    ctx.beginPath(); ctx.moveTo(px, -h / 2 + 4 * s); ctx.lineTo(px + pw / 2, -h / 2); ctx.lineTo(px + pw, -h / 2 + 4 * s); ctx.lineTo(px + pw, h / 2 - 4 * s); ctx.lineTo(px + pw / 2, h / 2); ctx.lineTo(px, h / 2 - 4 * s); ctx.fill() }   // the bellows
  ctx.fillStyle = "#16171b"; ctx.beginPath(); ctx.roundRect(12 * s + span, -h / 2 - 4 * s, 22 * s, h + 8 * s, 4 * s); ctx.fill()   // the bass end, in the far hand
  ctx.fillStyle = "#e9e2d0"; for (let r = 0; r < 4; r++) { ctx.beginPath(); ctx.arc(23 * s + span, -h / 2 + 12 * s + r * 13 * s, 2.6 * s, 0, TAU); ctx.fill() }
  ctx.restore()
  return span
}
function conjunto(t) {
  const ax = 1520, ay = 712, s = .82                       // back at the lamp post's foot: a layer between the table and the far end
  lit(() => glow(1570, 640, 190, 120, "rgba(255,230,180,.18)"))
  drawPlush(ctx, { x: ax, y: ay, s, tint: TEAL, number: "", t, seed: 21, look: 4, mouth: .5 + .3 * fm.pulseAt(t), lean: .06, hold: true, liftPx: 3 * fm.pulseAt(t) })
  accordion(ax - 58 * s, ay - 72 * s, t, s)               // held across the body, over the face, as first drawn
  if (PYSA.complete && PYSA.width) {
    const h = 116, w = h * PYSA.width / PYSA.height, x = 1612, y = ay, sway = Math.sin((t - OFF) / BEAT * Math.PI) * .045
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(x, y, w * .36, 6, 0, 0, TAU); ctx.fill()
    ctx.save(); ctx.translate(x, y); ctx.rotate(sway); ctx.drawImage(PYSA, -w / 2, -h - 2 * fm.pulseAt(t), w, h); ctx.restore()
  }
  ctx.font = '700 22px "Geist"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"
  for (let i = 0; i < 5; i++) {
    const u = ((t / (BEAT * 6) + i / 5) % 1), x = 1570 + Math.sin(u * 5 + i) * 34 + (i % 2 ? 26 : -20), y = 580 - u * 170
    ctx.globalAlpha = Math.sin(u * Math.PI) * .85; ctx.fillStyle = [TEAL, PINK, ORANGE, "#ffd166", "#fff"][i]; ctx.fillText(i % 2 ? "♪" : "♫", x, y)
  }
  ctx.globalAlpha = 1
}

// a couple of agents strolling far down the paseo
const STROLL = [{ tint: PINK, x: -1.6, z0: 15, z1: 28, sec: 30, ph: 0, n: 21 }, { tint: TEAL, x: 1.9, z0: 14, z1: 26, sec: 60, ph: .5, n: 11 }]
function strollers(t) {
  for (const a of STROLL) {
    const u = ((t / a.sec + a.ph) % 1 + 1) % 1, there = u < .5, p = there ? u * 2 : (1 - u) * 2, z = a.z0 * Math.pow(a.z1 / a.z0, p)
    const [x, y] = P(a.x, 0, z)
    drawPlush(ctx, { x, y, s: 2.6 / z * 2.2, tint: a.tint, number: "", t, stride: TAU * 1.7 * t + a.x, run: 1, back: there, look: 0, mouth: .3, seed: a.n })
  }
}

function render(t) {
  paint(t)
  fm.ascii("#0c0c0c", tint)
  shopLight()
  strollers(t)
  papelPicado(t, 9)                                        // the far strings, behind everything near
  lanterns(t)
  loteria(t)
  papelPicado(t, 0, 9)                                     // and the near ones over it all
  lampPost()                                               // near, at the right edge, framing it
  conjunto(t)
  celebrate(t)                                             // confetti and the zoom, over everything
  footer(t)
}
fm.start(render, waits)
</script>
