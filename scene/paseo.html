<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  html, body { margin: 0; background: #0c0c0c; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, the paseo: Agentic Nights at Market Square. Looking down the paseo at night: El Mercado's
  green arcade of round arches on the left, the brick building with its wood-framed windows and iron
  lanterns on the right, the twin-globe lamp post, brick pavers, a big tree at the far end. Papel
  picado strung wall to wall, backlit so the cuts glow: one flag in four is the DEVSA mark, the rest
  cut with >_, { }, >TV, </>. The nearest string of lights is the frontier models' logos, and the
  Discord mark glows on the brick wall.
  The hero is a folding table with a serape cloth: three agents at laptops, each with its status chip
  as on the Agentic Nights poster, and the Linux penguin at the end.
  The walls, floor and tree are ASCII, tinted by material (green arcade, red brick); everything that
  gives light is drawn in colour on top. 1920x1080, a seamless loop: render(t) draws a frame.
  The older market.html is Market Square by day, at Fiesta.

  ?xmas, the Christmas edition: the lotería table becomes a gift station run like a small software team. Letters to
  Santa drop into a red mailbox at the table's left end; the orange agent reads each one and files it on the laptop
  as an issue (#01 teclado, #02 taza...). The teal agent builds it (wraps it), the elf tests it with its stamp (a red
  stamp is a failing test, and it's rebuilt), and it deploys: off the table into Santa's sleigh. A build screen on a
  stand shows each issue's pipeline, issue, build, test, review, deploy. Papel picado in Christmas colours with warm lights along the
  strings and Christmas cuts (la estrella, la nochebuena, la campana, a snowflake, with { } and </> and the DEVSA mark
  kept), the big tree at the far end lit, luminarias along the arcade, nochebuenas in pots at its piers, a wreath and
  bow on the lamp post, the strollers carrying gifts. Seven gifts a loop slide off the table's end and drop into Santa's
  sleigh, parked on the pavers with one reindeer harnessed; Tux plays guitarrón in the conjunto. The last fifteen seconds are Santa's:
  he walks across the front of the paseo, hops into the sleigh and waves, and everyone cheers.
   Pixel snow, the conjunto still playing under the lamp post. Footer: the
  DEVSA FM radio.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script src="plush.js"></script>
<script src="fmkit.js"></script>
<script src="xmas-sprites.js"></script>
<script>
const XMAS = new URLSearchParams(location.search).has("xmas")   // Christmas: see the ?xmas notes in the header
const { W, H, TAU, CELL, COLS, ROWS, TEAL, PINK, ORANGE, ctx, g, LT, lerp, clamp01, ease, hash, glow, lit, footer, loadImg } = fm

// --- the world: x across, y up, z away; the paseo is 10.8 wide, the eye 1.6 up -------------------
const VX = 960, VY = 420, F = 520, EYE = 1.6, HALF = 5.4, NEAR = 1.1, FAR = 60
const P = (x, y, z) => [VX + x * F / z, VY + (EYE - y) * F / z]
const ARCADE_TOP = 5.6, BRICK_TOP = 3.4

// a tint map beside the grey scene: what each cell is made of, so the characters take its colour
const tm = document.createElement("canvas"); tm.width = COLS; tm.height = ROWS
const tc = tm.getContext("2d", { willReadFrequently: true })
let TINT = null
const MAT = { arcade: "#2f9a78", base: "#2f62b8", warm: "#ffc978", brick: "#b8573c", pavers: "#9c5440", tree: "#3f8150", sky: null }

function poly(c, pts) { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath() }
function shape(pts, v, mat) {                              // into the grey scene, and its material into the tint map
  poly(g, pts); g.fillStyle = fm.gray(v); g.fill()
  poly(tc, pts); if (mat) { tc.fillStyle = MAT[mat]; tc.fill() } else { tc.save(); tc.globalCompositeOperation = "destination-out"; tc.fill(); tc.restore() }
}
// a round-headed arch on the left wall, between depths z0 and z1, spring line at y, as a polygon
function archPts(X, z0, z1, y0, ys) {
  const zc = (z0 + z1) / 2, r = (z1 - z0) / 2, pts = [P(X, y0, z0), P(X, ys, z0)]
  for (let i = 1; i < 12; i++) { const a = Math.PI - i / 12 * Math.PI; pts.push(P(X, ys + Math.sin(a) * r, zc + Math.cos(a) * r)) }
  pts.push(P(X, ys, z1), P(X, y0, z1)); return pts
}

function paint(t) {
  g.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0); tc.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0)
  g.fillStyle = fm.gray(.02); g.fillRect(0, 0, W, H); tc.clearRect(0, 0, W, H)
  let st = 5; const sr = () => (st = (st * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 36; i++) { g.fillStyle = fm.gray(.22 + .2 * sr() + .1 * Math.sin(TAU * 3 * t / LT + i)); g.fillRect(VX - 520 + sr() * 1040, sr() * 300, CELL, CELL) }
  // the big tree at the far end, over the paseo
  for (let k = 0; k < 60; k++) {
    const a = hash(k, 3) * TAU, r = Math.sqrt(hash(3, k)), [x, y] = P(Math.cos(a) * r * 4.2, 5.2 + Math.sin(a) * r * 2.6, 26)
    g.fillStyle = fm.gray(.16 + .16 * hash(k, 9)); g.beginPath(); g.arc(x, y, 26 + 16 * hash(k, 5), 0, TAU); g.fill()
    tc.fillStyle = MAT.tree; tc.beginPath(); tc.arc(x, y, 26 + 16 * hash(k, 5), 0, TAU); tc.fill()
  }
  { const [x, y] = P(0, 0, 26), [, top] = P(0, 3.4, 26); shape([[x - 8, y], [x - 8, top], [x + 8, top], [x + 8, y]], .22, "tree") }
  // the pavers: red brick, coursed across, joints running to the far end
  shape([P(-HALF, 0, NEAR), P(HALF, 0, NEAR), P(HALF, 0, FAR), P(-HALF, 0, FAR)], .11, "pavers")
  g.strokeStyle = fm.gray(.24); g.lineWidth = CELL * .8
  for (let z = NEAR; z < FAR; z *= 1.07) { g.beginPath(); g.moveTo(...P(-HALF, 0, z)); g.lineTo(...P(HALF, 0, z)); g.stroke() }
  for (let x = -HALF; x <= HALF; x += .9) { g.beginPath(); g.moveTo(...P(x, 0, NEAR)); g.lineTo(...P(x, 0, FAR)); g.stroke() }
  // El Mercado, left: the green arcade, a blue base, round arches lit warm from the shops inside
  const XL = -HALF
  shape([P(XL, 0, NEAR), P(XL, ARCADE_TOP, NEAR), P(XL, ARCADE_TOP, FAR), P(XL, 0, FAR)], .2, "arcade")
  shape([P(XL, 0, NEAR), P(XL, .5, NEAR), P(XL, .5, FAR), P(XL, 0, FAR)], .26, "base")
  for (let z = 1.3; z < 44; z += 2.5) {
    shape(archPts(XL, z + .35, z + 2.15, 0, 2.2), .62 + .16 * hash(z, 1), "warm")                // the opening
    const ins = archPts(XL, z + .55, z + 1.95, .4, 2.2); poly(g, ins); g.strokeStyle = fm.gray(.34); g.lineWidth = CELL; g.stroke()   // a shop's display inside
  }
  shape([P(XL, ARCADE_TOP - .3, NEAR), P(XL, ARCADE_TOP, NEAR), P(XL, ARCADE_TOP, FAR), P(XL, ARCADE_TOP - .3, FAR)], .34, "arcade")  // the cornice
  // the brick building, right: brick piers, wood-framed windows lit inside, a low roofline
  const XR = HALF
  shape([P(XR, 0, NEAR), P(XR, BRICK_TOP, NEAR), P(XR, BRICK_TOP, FAR), P(XR, 0, FAR)], .17, "brick")
  g.strokeStyle = fm.gray(.26); g.lineWidth = CELL * .7
  for (let y = .3; y < BRICK_TOP; y += .3) { g.beginPath(); g.moveTo(...P(XR, y, NEAR)); g.lineTo(...P(XR, y, FAR)); g.stroke() }   // the courses
  for (let z = 1.6; z < 44; z += 2.7) {
    shape([P(XR, .5, z + .5), P(XR, 2.7, z + .5), P(XR, 2.7, z + 2.4), P(XR, .5, z + 2.4)], .4, "brick")       // the wood frame
    shape([P(XR, .65, z + .62), P(XR, 2.55, z + .62), P(XR, 2.55, z + 2.28), P(XR, .65, z + 2.28)], .6 + .15 * hash(z, 2), "warm")
    g.strokeStyle = fm.gray(.3); g.lineWidth = CELL * .8
    for (const zz of [z + 1.17, z + 1.73]) { g.beginPath(); g.moveTo(...P(XR, .65, zz)); g.lineTo(...P(XR, 2.55, zz)); g.stroke() }   // mullions
    g.beginPath(); g.moveTo(...P(XR, 1.95, z + .62)); g.lineTo(...P(XR, 1.95, z + 2.28)); g.stroke()
  }
  shape([P(XR - .5, BRICK_TOP, NEAR), P(XR, BRICK_TOP - .25, NEAR), P(XR, BRICK_TOP - .25, FAR), P(XR - .5, BRICK_TOP, FAR)], .3, "brick")   // the eave
  g.setTransform(1, 0, 0, 1, 0, 0); tc.setTransform(1, 0, 0, 1, 0, 0)
  TINT = tc.getImageData(0, 0, COLS, ROWS).data
}
const tint = (x, y) => { const i = (y * COLS + x) * 4; return TINT[i + 3] > 40 ? [TINT[i], TINT[i + 1], TINT[i + 2], 0] : null }

// --- light ---------------------------------------------------------------------------------------
function shopLight() {
  lit(() => {
    for (let z = 1.3; z < 30; z += 2.5) { const [x, y] = P(-HALF + .8, .05, z + 1.25); glow(x, y, 420 / z, 120 / z, "rgba(255,190,110,.13)") }
    for (let z = 1.6; z < 30; z += 2.7) { const [x, y] = P(HALF - .8, .05, z + 1.45); glow(x, y, 420 / z, 120 / z, "rgba(255,190,110,.11)") }
  })
}
// the iron lanterns on the brick piers, and the twin-globe lamp post
function lanterns(t) {
  for (let z = 1.6 + 2.7 * 1; z < 24; z += 2.7) {
    const [x, y] = P(HALF - .12, 2.9, z + .2), s = 9 / z
    lit(() => glow(x, y, 26 * s, 26 * s, "rgba(255,200,120,.5)"))
    ctx.fillStyle = "#16130f"; ctx.fillRect(x - 3 * s, y - 6 * s, 6 * s, 12 * s)
    ctx.fillStyle = "#ffd89a"; ctx.fillRect(x - 2 * s, y - 4 * s, 4 * s, 8 * s)
  }
}
const LAMP = [4.2, 3.0]                                    // world x, z
function lampPost() {
  const [x, y] = P(LAMP[0], 0, LAMP[1]), [, top] = P(0, 3.1, LAMP[1]), s = F / LAMP[1]
  lit(() => { for (const d of [-1, 1]) glow(x + d * .38 * s, top - .2 * s, 1.3 * s, 1.3 * s, "rgba(255,232,190,.42)"); glow(x, y, 2.6 * s, .5 * s, "rgba(255,220,170,.22)") })
  ctx.fillStyle = "#1b1d22"
  ctx.beginPath(); ctx.roundRect(x - .18 * s, y - .5 * s, .36 * s, .5 * s, 6); ctx.fill()                          // the base
  ctx.fillRect(x - .055 * s, top, .11 * s, y - top)                                                              // the post
  ctx.fillRect(x - .42 * s, top + .02 * s, .84 * s, .05 * s)                                                     // the crossarm
  for (const d of [-1, 1]) { ctx.fillStyle = "#fff6e2"; ctx.beginPath(); ctx.arc(x + d * .38 * s, top - .2 * s, .17 * s, 0, TAU); ctx.fill() }
}

// --- papel picado: backlit cut paper, the cuts glowing ----------------------------------------
// the DEVSA mark's light shapes (the three tabs, the chevron, SA, the cursor), from devsa-alt-logo.svg:
// on the mark's flags they are cut through the paper, so they glow, the way the mark's light parts do
const MARK_CUTS = new Path2D("M250.28 0H485.25V91.95H250.28z M234.97 0H30.65C13.8 0 0 13.8 0 30.65v61.3h234.97V0zM705.05 0H500.59v91.95H735.7v-61.3C735.7 13.8 721.9 0 705.05 0zM352.52 459.82c0 9.2 6.14 15.34 15.34 15.34h245.23c9.2 0 15.34-6.140 15.34-15.34v-45.99c0-9.2-6.14-15.34-15.34-15.34H367.83c-9.2 0-15.34 6.14-15.34 15.34v45.99h.03zM193.13 320.33l-95.04 95.04c-7.66 7.66-7.66 18.4 0 24.51l27.59 27.59c7.66 7.66 18.4 7.66 24.51 0l134.89-134.89c6.76-5.64 7.710-15.68 2.08-22.43-.62-.76-1.32-1.46-2.08-2.08L150.19 173.18c-6.14-6.14-18.4-6.14-24.51 0l-27.59 27.59c-7.66 6.14-7.66 16.85 0 24.51l95.04 95.04zM370.33 359.62c-11.28-8.54-17.23-20.81-17.830-36.83l49.22 1.13c.5 8.5 4.16 12.83 10.97 12.98 2.5.06 4.63-.48 6.4-1.63 1.76-1.14 2.68-2.96 2.73-5.47.08-3.47-1.73-6.33-5.44-8.58-3.71-2.24-9.49-4.84-17.35-7.81-9.38-3.55-17.13-7-23.24-10.34-6.12-3.34-11.33-8.12-15.63-14.34-4.31-6.22-6.28-14.13-5.92-23.72.22-9.59 2.88-17.71 7.97-24.34 5.09-6.63 11.95-11.58 20.58-14.86 8.63-3.28 18.3-4.8 29.01-4.55 18.07.42 32.34 4.92 42.78 13.51 10.45 8.59 15.77 20.47 15.98 35.63l-49.85-1.15c-.04-4.17-1.02-7.19-2.92-9.04-1.91-1.85-4.25-2.81-7.03-2.87-1.95-.05-3.56.58-4.84 1.87-1.28 1.29-1.95 3.12-2 5.48-.08 3.34 1.7 6.13 5.34 8.37 3.63 2.24 9.45 4.98 17.45 8.23 9.23 3.69 16.84 7.21 22.82 10.54 5.97 3.34 11.12 7.91 15.44 13.71 4.32 5.81 6.38 13.020 6.18 21.64-.21 9.04-2.62 17.09-7.23 24.15-4.62 7.06-11.21 12.51-19.78 16.34-8.58 3.84-18.7 5.62-30.38 5.35-17.66-.41-32.13-4.88-43.41-13.42zM573.28 348.25l-48.5-.28-7.32 21.95-47.88-.28 54.06-145.19 52.61.3 52.18 145.8-48.09-.28-7.07-22.03zm-11.87-30.27l-13.62-40.33-12.68 40.63 26.3-.31z")
const PAPER = XMAS ? ["#e8323c", "#2fa356", "#ffd166", "#f4efe6", TEAL, PINK, "#e8323c", "#2fa356", "#ffd166"] : [PINK, TEAL, ORANGE, "#ffd166", TEAL, PINK, "#9b5de5", ORANGE, "#7bd88f"]
const CUTS = ["{ }", "star", "</>"]
const STRINGS = [4.4, 5.9, 7.8, 10.4, 14]
// Christmas: the cuts Mexican papel picado has at Navidad, our own shapes, with { } and </> kept on a few
const XCUTS = ["estrella", "nochebuena", "{ }", "campana", "flake", "estrella", "</>", "nochebuena", "campana", "flake"]
const SNOWFLAKE = ["...#...", "#..#..#", ".#.#.#.", "..###..", "#######", "..###..", ".#.#.#.", "#..#..#", "...#..."]
function xcut(cut, w, h) {                                   // the cut, centred on the flag, in the current fill
  const cy = h * .46
  if (cut === "estrella") { const R = w * .27, r = w * .11; ctx.beginPath(); for (let i = 0; i < 14; i++) { const a = -Math.PI / 2 + i * Math.PI / 7, rr = i % 2 ? r : R; ctx.lineTo(Math.cos(a) * rr, cy + Math.sin(a) * rr) } ctx.fill(); return true }
  if (cut === "nochebuena") { for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(0, cy); ctx.rotate(i * Math.PI / 3); ctx.beginPath(); ctx.ellipse(0, -w * .13, w * .055, w * .13, 0, 0, TAU); ctx.fill(); ctx.restore() }
    ctx.save(); ctx.globalCompositeOperation = "destination-out"; ctx.beginPath(); ctx.arc(0, cy, w * .045, 0, TAU); ctx.fill(); ctx.restore()
    for (const [dx, dy] of [[0, 0], [-1, .7], [1, .7]]) { ctx.beginPath(); ctx.arc(dx * w * .025, cy + dy * w * .025 - w * .01, w * .014, 0, TAU); ctx.fill() } return true }
  if (cut === "campana") { const b = w * .22; ctx.beginPath(); ctx.moveTo(-b * .2, cy - b * .9); ctx.lineTo(b * .2, cy - b * .9); ctx.quadraticCurveTo(b * .75, cy - b * .7, b * .8, cy + b * .5); ctx.lineTo(b, cy + b * .72); ctx.lineTo(-b, cy + b * .72); ctx.lineTo(-b * .8, cy + b * .5); ctx.quadraticCurveTo(-b * .75, cy - b * .7, -b * .2, cy - b * .9); ctx.fill()
    ctx.beginPath(); ctx.arc(0, cy - b * 1.02, b * .14, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(0, cy + b * .9, b * .16, 0, TAU); ctx.fill(); return true }
  if (cut === "flake") { const q = w * .055; SNOWFLAKE.forEach((row, ry) => [...row].forEach((c, rx) => { if (c === "#") ctx.fillRect((rx - 3.5) * q, cy + (ry - 4.5) * q, q, q) })); return true }
  return false
}           // few enough that the arcade and the brick show
function sparkle(x, y, r) {                                // a four-point star, the sign AI products use
  const q = r * .16
  ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + q, y - q, x + r, y); ctx.quadraticCurveTo(x + q, y + q, x, y + r)
  ctx.quadraticCurveTo(x - q, y + q, x - r, y); ctx.quadraticCurveTo(x - q, y - q, x, y - r); ctx.fill()
}
function flag(x, y, w, h, i, k, sway, near) {
  const mark = i % 4 === 0
  ctx.save(); ctx.translate(x, y); ctx.transform(1, 0, sway, 1, 0, 0)
  ctx.fillStyle = PAPER[(i + k * 2) % PAPER.length]; ctx.globalAlpha = .94
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.lineTo(w / 2, h * .86)
  for (let j = 6; j >= 0; j--) ctx.lineTo(-w / 2 + w * j / 6, h * (j % 2 ? .86 : 1))            // the scalloped hem
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1
  if (near) {
    const CUT = "rgba(255,244,214,.92)"
    ctx.fillStyle = CUT; ctx.shadowColor = "rgba(255,236,190,.8)"; ctx.shadowBlur = w * .1
    if (mark) {                                             // the mark, cut through: its light shapes glow, the paper is its body
      const k2 = w * .58 / 735.7; ctx.save(); ctx.translate(-w * .29, h * .44 - 551.77 * k2 / 2); ctx.scale(k2, k2); ctx.fill(MARK_CUTS); ctx.restore()
    } else {
      const cut = (XMAS ? XCUTS : CUTS)[(i + k) % (XMAS ? XCUTS : CUTS).length]
      if (XMAS && xcut(cut, w, h)) {}
      else if (cut === "star") { sparkle(0, h * .46, w * .2); sparkle(w * .2, h * .3, w * .08) }   // the AI sparkle, and its little one
      else { ctx.font = `700 ${Math.round(w * .3)}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(cut, 0, h * .46) }
    }
    ctx.shadowBlur = 0; ctx.fillStyle = "rgba(255,244,214,.7)"
    for (let j = 0; j < 7; j++) {                            // the punched lace: a border of diamonds above, dots below
      const dx = -w * .36 + j * w * .12, d = w * .03
      ctx.beginPath(); ctx.moveTo(dx, h * .07); ctx.lineTo(dx + d, h * .07 + d); ctx.lineTo(dx, h * .07 + 2 * d); ctx.lineTo(dx - d, h * .07 + d); ctx.fill()
      ctx.beginPath(); ctx.arc(dx, h * .8, d * .8, 0, TAU); ctx.fill()
    }
  }
  ctx.restore()
}
function papelPicado(t, from, to = 99) {
  for (let k = STRINGS.length - 1; k >= 0; k--) {
    const z = STRINGS[k]; if (z < from || z >= to) continue
    const n = 13, at = u => P(lerp(-HALF, HALF, u), 4.7 - .55 * Math.sin(u * Math.PI), z)
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = Math.max(1, 4 / z); ctx.beginPath()
    for (let i = 0; i <= 40; i++) { const [x, y] = at(i / 40); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) } ctx.stroke()
    if (XMAS) for (let i = 0; i <= n; i++) { const [x, y] = at(i / n), r = Math.max(2, 26 / z)   // warm bulbs between the flags
      lit(() => glow(x, y, r * 3, r * 3, "rgba(255,226,170,.5)")); ctx.fillStyle = "#fff1c8"; ctx.beginPath(); ctx.arc(x, y + r, r, 0, TAU); ctx.fill() }
    for (let i = 0; i < n; i++) {
      const [x, y] = at((i + .5) / n), w = .62 * F / z, h = .74 * F / z
      const sway = XMAS ? Math.sin(TAU * 3 * t / fm.T - i * .5 + k * 1.3) * .045 + Math.sin(TAU * 7 * t / fm.T + i * 1.7 + k) * .015   // Christmas: a slow breeze rolling along the string, not the beat
        : Math.sin(TAU * (t / LT * 8) + i * .9 + k * 1.3) * .1 + .06 * fm.pulseAt(t)
      flag(x, y, w, h, i, k, sway, z < 11)
    }
  }
}

const waits = []

// --- the hero: Lotería. The caller, at the left end of the table, holds each card up, flips it onto the easel
// and calls its verse; the teal and pink agents play tablas and drop a frijol on every match, and Tux plays
// on his laptop. Everything lands on the song's beat (beats-cumbia.json when synced). Ten calls a round; the
// winner rotates, Tux, teal, pink, and the camera zooms onto the winning tabla. Synced, the song holds
// three rounds. The cards are DEVSA's own and the City of San Antonio's icons; original art throughout.
const TABLE = { x0: 500, x1: 1420, back: 772, front: 800 }
const SERAPE = [TEAL, "#141416", PINK, "#ffd166", ORANGE, "#141416", TEAL, PINK, "#7bd88f", ORANGE]
const [PENGUIN, pw] = loadImg("penguin.png"); waits.push(pw)
const [PYSA, yw] = loadImg("pysa-mascot-full.webp"); waits.push(yw)
// the City of San Antonio's line icons, inked onto cards
const ICONS = {}
for (const n of ["tower", "alamo", "sanjose", "taco", "mission-bell", "concha", "jalapeno", "guitar", "cactus"]) waits.push(fetch(`icons/${n}.svg`).then(r => r.ok ? r.text() : "", () => "").then(svg => { if (/viewBox=/.test(svg)) ICONS[n] = svg }))
const INKED = {}

  if (u < .56 && x > TABLE.x0 - 100 && x < TABLE.x1 && Math.sin(t * 7) > 0) { ctx.fillStyle = "#e8323c"; ctx.fillRect(x + 6 * px, y - h + 5 * px, 2 * px, 6 * px); ctx.fillStyle = "#f4f4f4"; ctx.fillRect(x + 6 * px, y - h + 4 * px, 2 * px, px) }   // waving to the table
}
// a wreath: a full ring of greenery in three greens, red berries, warm lights woven in, a red bow with tails
const WREATH_DOTS = (() => { const out = []; let sd = 7; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 240; i++) { const a = r() * TAU, d = .62 + r() * .5; out.push([Math.cos(a) * d, Math.sin(a) * d, r()]) } return out })()
function wreath(x, y, R, t) {
  const p = Math.max(3, Math.round(R / 8))
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.arc(x + 3, y + 4, R * 1.05, 0, TAU); ctx.fill()
  for (const [dx, dy, k] of WREATH_DOTS) { ctx.fillStyle = k < .35 ? "#1d5a32" : k < .75 ? "#2a7a42" : "#3f9a56"; ctx.fillRect(Math.round(x + dx * R) - p * .7, Math.round(y + dy * R) - p * .7, p * 1.4, p * 1.4) }
  WREATH_DOTS.forEach(([dx, dy], i) => { if (i % 11) return; ctx.fillStyle = "#d6223a"; ctx.fillRect(Math.round(x + dx * R * .95) - p / 2, Math.round(y + dy * R * .95) - p / 2, p, p) })
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + .3, lx = x + Math.cos(a) * R * .85, ly = y + Math.sin(a) * R * .85, tw = .75 + .25 * Math.sin(TAU * 2 * t / fm.T + i)
    lit(() => glow(lx, ly, 9, 9, `rgba(255,220,150,${(.5 * tw).toFixed(2)})`)); ctx.fillStyle = "#fff1c8"; ctx.fillRect(lx - 1.5, ly - 1.5, 3, 3) }
  const by = y + R * .78; ctx.fillStyle = "#c8202e"
  ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x - R * .55, by - R * .3); ctx.lineTo(x - R * .55, by + R * .25); ctx.fill()
  ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + R * .55, by - R * .3); ctx.lineTo(x + R * .55, by + R * .25); ctx.fill()
  ctx.fillStyle = "#a0141f"; ctx.beginPath(); ctx.moveTo(x - 3, by); ctx.lineTo(x - R * .35, by + R * .7); ctx.lineTo(x - R * .18, by + R * .62); ctx.lineTo(x, by + 2); ctx.fill()
  ctx.beginPath(); ctx.moveTo(x + 3, by); ctx.lineTo(x + R * .35, by + R * .7); ctx.lineTo(x + R * .18, by + R * .62); ctx.lineTo(x, by + 2); ctx.fill()
  ctx.fillStyle = "#e8323c"; ctx.fillRect(x - p, by - p, 2 * p, 2 * p)
}
// a potted nochebuena: a terracotta pot with a rim, dark leaves underneath, two layers of pointed red bracts in a star,
// the little yellow flowers at the centre. s is the scale (px per world unit) where it stands
function nochebuena(x, y, s, seed) {
  const pw = .4 * s, ph = .32 * s
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(x, y, pw * .7, pw * .14, 0, 0, TAU); ctx.fill()
  ctx.fillStyle = "#a9542f"; ctx.beginPath(); ctx.moveTo(x - pw * .42, y - ph); ctx.lineTo(x + pw * .42, y - ph); ctx.lineTo(x + pw * .32, y); ctx.lineTo(x - pw * .32, y); ctx.fill()   // the pot
  ctx.fillStyle = "#c46a3c"; ctx.fillRect(x - pw * .5, y - ph - pw * .14, pw, pw * .16)                                // its rim
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x - pw * .3, y - ph + 2, pw * .1, ph - 6)
  const cy = y - ph - pw * .2, leaf = (a, len, wid, c) => { ctx.save(); ctx.translate(x, cy); ctx.rotate(a); ctx.fillStyle = c
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(wid, -len * .45, 0, -len); ctx.quadraticCurveTo(-wid, -len * .45, 0, 0); ctx.fill(); ctx.restore() }
  for (let i = 0; i < 7; i++) leaf(i * TAU / 7 + .2 + seed, pw * .62, pw * .16, i % 2 ? "#1d5a32" : "#24693a")      // dark leaves underneath
  for (let i = 0; i < 7; i++) leaf(i * TAU / 7 + .65 + seed, pw * .56, pw * .15, "#b3162a")                          // the outer bracts
  for (let i = 0; i < 6; i++) leaf(i * TAU / 6 + seed * 2, pw * .38, pw * .12, "#e0263a")                            // the inner bracts, brighter
  ctx.fillStyle = "#f2c230"; for (const [dx, dy] of [[0, 0], [-.04, .03], [.04, .03], [0, -.04]]) { ctx.beginPath(); ctx.arc(x + dx * pw * 2, cy + dy * pw * 2, Math.max(1.5, pw * .035), 0, TAU); ctx.fill() }
}
// luminarias along the foot of El Mercado's arcade, down the paseo; nochebuenas in pots at the piers; the lamp post dressed
function paseoDressing(t) {
  for (let z = 2.6; z < 30; z *= 1.16) {
    const [x, y] = P(-HALF + .35, 0, z), s = F / z, bw = .2 * s, bh = .28 * s, fl = .8 + .2 * Math.sin(TAU * 3 * t / fm.T + z * 3)
    lit(() => glow(x, y - bh * .6, bw * 2.2, bh * 1.6, `rgba(255,190,100,${(.35 * fl).toFixed(3)})`))
    ctx.fillStyle = "#c9a26a"; ctx.fillRect(x - bw / 2, y - bh, bw, bh); ctx.fillStyle = `rgba(255,214,140,${(.7 * fl).toFixed(3)})`; ctx.fillRect(x - bw * .25, y - bh * .75, bw * .5, bh * .45)
  }
  for (let n = 1; n < 6; n++) { const z = 1.3 + 2.5 * n + .1, [x, y] = P(-HALF + .45, 0, z); nochebuena(x, y, F / z, n) }
}
function lampWreath(t) {                                    // the lamp post: a wreath hung on a ribbon, in front of the post
  const [lx, ly] = P(LAMP[0], 1.75, LAMP[1]), ls = F / LAMP[1], [, ty] = P(0, 3.1, LAMP[1])
  ctx.fillStyle = "#b8202e"; ctx.fillRect(lx - .02 * ls, ty + .1 * ls, .04 * ls, ly - ty - .1 * ls - .26 * ls)
  wreath(lx, ly, .27 * ls, t)
}
// the big tree at the far end, strung with lights
function treeLights(t) {
  for (let k = 0; k < 90; k++) { const a = hash(k, 13) * TAU, r = Math.sqrt(hash(13, k)), [x, y] = P(Math.cos(a) * r * 3.8, 5.2 + Math.sin(a) * r * 2.3, 26)
    const c = ["#fff1c8", "#e8323c", GOLD, "#2fd06a", "#fff1c8"][k % 5], tw = .6 + .4 * Math.sin(TAU * 2 * t / fm.T + k)
    lit(() => glow(x, y, 8, 8, fm.rgba(c, .5 * tw))); ctx.fillStyle = c; ctx.globalAlpha = .7 + .3 * tw; ctx.fillRect(x - 2, y - 2, 4, 4); ctx.globalAlpha = 1 }
}
const FLAKE = ["...#...", "#..#..#", ".#.#.#.", "..###..", "#######", "..###..", ".#.#.#.", "#..#..#", "...#..."]
const FLAKES = Array.from({ length: 60 }, (_, i) => { const kind = i % 10 < 6 ? 0 : i % 10 < 9 ? 1 : 2
  return { x: hash(i, 31) * W, ph: hash(i, 32), laps: kind === 2 ? 1 : 2, sw: 10 + hash(i, 33) * 30, kind, px: [4, 2, 4][kind], a: [.5, .6, .85][kind] } })
function snow(t) {
  for (const f of FLAKES) {
    const h = f.kind ? 9 * f.px : f.px, k = ((t / fm.T) * f.laps + f.ph) % 1, y = Math.round((-h + k * (H + 2 * h)) / f.px) * f.px
    const x = Math.round((f.x + Math.sin(TAU * f.laps * t / fm.T + f.ph * 6) * f.sw) / f.px) * f.px
    ctx.fillStyle = `rgba(255,255,255,${f.a})`
    if (!f.kind) { ctx.fillRect(x, y, f.px, f.px); continue }
    FLAKE.forEach((row, ry) => [...row].forEach((c, rx) => { if (c === "#") ctx.fillRect(x + rx * f.px, y + ry * f.px, f.px, f.px) }))
  }
}
if (XMAS) window.FOOTER_SPRITE = (x, bottom, t) => { xs.radio(ctx, x, bottom - xs.RADIO.length * 3, 3, (((t - OFF) / BEAT) / 4) % 1); return 26 * 3 }

function render(t) {
  paint(t)
  fm.ascii("#0c0c0c", tint)
  shopLight()
  strollers(t)
  papelPicado(t, 9)                                        // the far strings, behind everything near
  lanterns(t)
  if (XMAS) treeLights(t)
  if (XMAS) { paseoDressing(t); giftStation(t) } else loteria(t)
  papelPicado(t, 0, 9)                                     // and the near ones over it all
  lampPost()                                               // near, at the right edge, framing it
  if (XMAS) lampWreath(t)
  if (XMAS) santaWalk(t)
  conjunto(t)
  if (!XMAS) celebrate(t)                                  // confetti and the zoom, over everything
  if (XMAS) snow(t)
  footer(t)
}
fm.start(render, waits)
</script>
