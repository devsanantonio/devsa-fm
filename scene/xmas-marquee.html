<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 900; src: url(fonts/Geist-Black.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 400; font-style: italic; src: url(fonts/Geist-Italic.woff2) format("woff2"); }
  html, body { margin: 0; background: #07080c; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, movie night at Mission Marquee Plaza: the old Mission Drive-In's screen tower on the South Side, a
  Christmas night, the lawn in front of it. In ASCII, as the place is: one tower, centred and symmetrical, teal with a cream
  cap and a heavy black frame round the screen; Art Deco shoulders curving down on both sides into the long low
  wall that runs the width of the lawn, with its white poster panels; a half-round stone stage in front of the
  screen, speakers on stands at its ends; a treeline and the city's glow over the wall; the lawn. Our own
  drawing of the place, not a trace of any photograph.

  On the screen, in full colour, devsa.community's hero: "Where San Antonio" and its typed word (Builds, Connects,
  Grows, Learns) over the wall of 22 event photos in scrolling columns, tilted as the site tilts them. The photos are local only (scene/hero/, out of git), copied from next-devsa's public/hero/.

  In colour, for Christmas: bulbs along the tower's edges and the wall's top stepping on the beat, a wreath on the
  tower over the screen, luminarias along the lawn, the screen's light falling on the lawn.
  Twilight low behind the wall, deep blue to ember, as in every photograph of the place. The lawn fills with three
  rows of camp chairs (red, blue, pink, purple), smaller toward the screen, the cast seen from behind in them, a few
  saved with a blanket over the back. Once a loop an elf gets up from the red blanket, walks to the penguin's cocoa
  stand and back with a steaming cup; two agents whisper; one cheers when "Builds." finishes typing; an elf pulls a
  blanket up over its shoulders. Santa's sleigh
  crosses the sky once a loop. Pixel snow; the DEVSA FM radio in the footer.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script src="plush.js"></script>
<script src="fmkit.js"></script>
<script src="xmas-sprites.js"></script>
<script>
const { W, H, TAU, CELL, TEAL, PINK, ORANGE, ctx, g, T, lerp, hash, glow, lit, footer } = fm
const GOLD = xs.GOLD
const BPM = (window.BEATS && window.BEATS.bpm) || 76, OFFSET = (window.BEATS && window.BEATS.offset) || 0
const beatPh = t => { const b = (t - OFFSET) * BPM / 60; return ((b % 1) + 1) % 1 }
const beatN = t => Math.floor(((t - OFFSET) * BPM / 60) % 600 + 600)

// the layout, in pixels
const GROUND = 690                                      // where the tower and the wall meet the lawn
// as the place is: one tower, centred and symmetrical, teal with a cream cap; Art Deco shoulders curving down on
// both sides into a long low wall that runs the width of the lawn; a half-round stone stage in front of the screen
const TOWER = { x0: 600, x1: 1320, top: 150, sh: 470 }  // sh: where the shoulders start to curve out
const SCREEN = { x: 640, y: 210, w: 640, h: 360 }       // 16:9, in a heavy black frame
const WALL = { top: 590 }                               // the wall, full width
const STAGE = { cx: 960, rx: 430, ry: 40 }              // the half-round stage, its front edge on the lawn

// ---- the screen: devsa.community's hero, the photo wall ----------------------------------------------
// The same 22 event photos, in the same order, as next-devsa's components/hero-bridge.tsx (copied from its
// public/hero/, 3:4, kept local: scene/hero/ is out of git). Split into columns by i % cols as the site does,
// alternate columns scrolling up and down, the whole wall tilted a touch, as the hero is. Each column moves a
// whole number of its own heights a loop, so it's seamless.
const HERO = ["shebuilds", "sastw-room-full", "replay7", "sastw-stickers", "sastw-shared-stories", "techday2", "sastw-talk-stage",
  "sastw-the-reading", "utsa", "sastw-student-stage", "sastw-room-hand", "ltai-talk", "sastw-speaker-point", "sastw-story-show", "replay9",
  "sastw-listening", "sastw-room-tables", "morehuman-9743", "sastw-lounge", "sastw-workshop", "replay13", "sastw-stage-wide"]
const HERO_IMG = HERO.map(n => fm.loadImg("hero/" + n + ".webp"))
const heroReady = Promise.all(HERO_IMG.map(([, p]) => p))
const COLS_N = 4, COL_CYCLES = [2, 2, 2, 1]             // the site's columns run 55, 65, 75, 85 s; the nearest whole cycles a 120 s loop
const COLUMNS = Array.from({ length: COLS_N }, (_, c) => HERO_IMG.map(([im]) => im).filter((_, i) => i % COLS_N === c))
// the screen's average colour, for the light it throws on the lawn and the tower
const AVG = document.createElement("canvas"); AVG.width = AVG.height = 1
const avgCtx = AVG.getContext("2d", { willReadFrequently: true })
let screenRGB = [120, 140, 170]

const [PENGUIN, penguinReady] = fm.loadImg("penguin.png")

// ---- 1. the world, in greys --------------------------------------------------------------------
function paint(t) {
  g.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0)
  g.fillStyle = fm.gray(.02); g.fillRect(0, 0, W, H)
  for (let i = 0; i < 70; i++) {                        // stars, a whole number of twinkles a loop
    g.fillStyle = fm.gray(.22 + .2 * Math.sin(TAU * 3 * t / T + i)); g.fillRect(hash(i, 1) * W, hash(i, 2) * 420, CELL, CELL)
  }
  // a few long clouds, drifting a whole width a loop
  for (let i = 0; i < 5; i++) {
    const x = ((hash(i, 5) * W + (t / T) * W) % (W + 600)) - 300, y = 60 + hash(i, 6) * 260
    g.fillStyle = fm.gray(.07); g.beginPath(); g.ellipse(x, y, 260 + hash(i, 7) * 200, 26, 0, 0, TAU); g.fill()
  }
  // the horizon: the city's glow, and a low treeline showing over the wall on both sides
  const glowG = g.createLinearGradient(0, WALL.top - 160, 0, WALL.top); glowG.addColorStop(0, fm.gray(.02)); glowG.addColorStop(1, fm.gray(.14))
  g.fillStyle = glowG; g.fillRect(0, WALL.top - 160, W, 160)
  for (let i = 0; i < 30; i++) {
    const side = i % 2, x = side ? 1380 + hash(i, 21) * 600 : -60 + hash(i, 21) * 600, r = 34 + hash(i, 22) * 40, y = WALL.top - 20 - hash(i, 23) * 30
    g.fillStyle = fm.gray(.16 + .06 * hash(i, 24)); g.beginPath(); g.ellipse(x, y, r, r * .7, 0, 0, TAU); g.fill()
  }
  for (const x of [120, 300, 1610, 1790]) { g.fillStyle = fm.gray(.4); g.fillRect(x, WALL.top - 150, 4, 150); g.fillStyle = fm.gray(.85); g.fillRect(x - 6, WALL.top - 156, 16, CELL) }   // parking-lot lights beyond
  // the wall: full width, a coping along its top, pilasters, and white poster panels in groups
  g.fillStyle = fm.gray(.36); g.fillRect(0, WALL.top, W, GROUND - WALL.top)
  g.fillStyle = fm.gray(.46); g.fillRect(0, WALL.top, W, 10)
  for (let x = 40; x < W; x += 150) { g.fillStyle = fm.gray(.29); g.fillRect(x, WALL.top + 12, 6, GROUND - WALL.top - 12) }
  for (const gx of [150, 1600]) for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) { g.fillStyle = fm.gray(.82); g.fillRect(gx + c * 62, WALL.top + 22 + r * 36, 54, 28) }
  for (const gx of [430, 1440]) { g.fillStyle = fm.gray(.78); g.fillRect(gx, WALL.top + 26, 50, 44) }
  // the tower, with its shoulders curving out and down to the wall on both sides
  const { x0, x1, top, sh } = TOWER
  g.fillStyle = fm.gray(.5)
  g.beginPath(); g.moveTo(x0, top); g.lineTo(x1, top); g.lineTo(x1, sh)
  g.quadraticCurveTo(x1 + 20, WALL.top - 10, x1 + 130, WALL.top); g.lineTo(x1 + 130, GROUND); g.lineTo(x0 - 130, GROUND); g.lineTo(x0 - 130, WALL.top)
  g.quadraticCurveTo(x0 - 20, WALL.top - 10, x0, sh); g.closePath(); g.fill()
  for (const x of [x0 + 18, x1 - 24]) { g.fillStyle = fm.gray(.42); g.fillRect(x, top + 10, 6, sh - top - 10) }   // its pilasters
  g.fillStyle = fm.gray(.72); g.fillRect(x0 - 14, top - 22, x1 - x0 + 28, 22)                 // the cream cap
  g.fillStyle = fm.gray(.8); g.fillRect(x0 + 30, top - 30, x1 - x0 - 60, 8)                   // and its narrower top step
  g.fillStyle = fm.gray(.06); g.fillRect(SCREEN.x - 20, SCREEN.y - 20, SCREEN.w + 40, SCREEN.h + 40)   // the screen's heavy black frame
  // the lawn: dark grass, rows of texture, lit nearer the screen
  g.fillStyle = fm.gray(.12); g.fillRect(0, GROUND, W, H - GROUND)
  for (let k = 1; k <= 16; k++) {                     // rows of grass, tightening toward the screen: spaced by depth, shorter and fainter far off
    const d = k / 16, y = GROUND + (H - GROUND) * d * d, len = 12 + 30 * d, step = 40 + 60 * d
    for (let x = (k % 2) * step / 2; x < W; x += step) { g.fillStyle = fm.gray(.14 + .08 * d + .04 * hash(x, k)); g.fillRect(x, y, len, 2 + 3 * d) }
  }
  // the screen's light on the lawn: brighter in a wedge under it
  const sg = g.createRadialGradient(SCREEN.x + SCREEN.w / 2, GROUND, 0, SCREEN.x + SCREEN.w / 2, GROUND, 700)
  sg.addColorStop(0, fm.gray(.24)); sg.addColorStop(1, "rgba(0,0,0,0)")
  g.fillStyle = sg; g.fillRect(0, GROUND, W, H - GROUND)
  // the stage, over the lawn: a half-round of stone in front of the screen
  g.fillStyle = fm.gray(.42); g.beginPath(); g.ellipse(STAGE.cx, GROUND, STAGE.rx, STAGE.ry, 0, 0, Math.PI); g.fill()
  g.fillStyle = fm.gray(.55); g.beginPath(); g.ellipse(STAGE.cx, GROUND - 2, STAGE.rx, STAGE.ry * .7, 0, 0, Math.PI); g.fill()
  g.strokeStyle = fm.gray(.3); g.lineWidth = 3; g.beginPath(); g.ellipse(STAGE.cx, GROUND, STAGE.rx, STAGE.ry, 0, 0, Math.PI); g.stroke()
  g.setTransform(1, 0, 0, 1, 0, 0)
}

// the tower's colours over its characters: teal tower and wall, the cap in cream
const TTEAL = [64, 170, 156, .66], TCREAM = [240, 230, 204, .8], TWALL = [52, 140, 128, .58]
function towerTint(cx, cy) {
  const X = cx * CELL + CELL / 2, Y = cy * CELL + CELL / 2, { x0, x1, top, sh } = TOWER
  if (Y >= GROUND) return null
  if (X >= SCREEN.x - 20 && X < SCREEN.x + SCREEN.w + 20 && Y >= SCREEN.y - 20 && Y < SCREEN.y + SCREEN.h + 20) return null
  if (X >= x0 - 14 && X < x1 + 14 && Y >= top - 30 && Y < top) return TCREAM
  const sv = g.getImageData(cx, cy, 1, 1).data[0] / 255
  if (Y >= WALL.top + 20 && sv > .75) return null                                           // the poster panels stay white
  if (X >= x0 && X < x1 && Y >= top) return TTEAL
  if (X >= x0 - 130 && X < x1 + 130 && Y >= sh && sv > .45) return TTEAL                    // the shoulders
  if (Y >= WALL.top) return TWALL
  return null
}

// ---- 2. the screen, in colour ---------------------------------------------------------------------
// the hero's headline over the wall, as the site sets it: the dark hold on the left, "Where" in light italic at
// white/65, "San Antonio" in Geist Black, and the typed word under it with the pink caret. The site types Builds,
// Connects, Grows, Learns (95 ms a letter, held 2.4 s, deleted at 45 ms, 320 ms between); here that cycle is
// stretched by a few hundredths of a second in the hold so eight cycles fill the 120 s loop exactly.
const HERO_WORDS = ["Builds", "Connects", "Grows", "Learns"]
const WORD_T = HERO_WORDS.map(wd => { const n = wd.length + 1; return { n, type: n * .095, del: n * .045 } })
const CYCLE = T / 8, HOLD = (CYCLE - WORD_T.reduce((a, w) => a + w.type + w.del + .32, 0)) / 4
function typed(t) {
  let u = t % CYCLE
  for (let i = 0; i < 4; i++) {
    const { n, type, del } = WORD_T[i], full = HERO_WORDS[i] + "."
    if (u < type) return full.slice(0, Math.floor(u / .095) + 1)
    u -= type; if (u < HOLD) return full; u -= HOLD
    if (u < del) return full.slice(0, n - 1 - Math.floor(u / .045)); u -= del
    if (u < .32) return ""; u -= .32
  }
  return HERO_WORDS[0] + "."
}
function heroText(t) {
  const { x, y, w, h } = SCREEN
  const sh = ctx.createLinearGradient(x, 0, x + w, 0)
  sh.addColorStop(0, "rgba(10,10,10,.95)"); sh.addColorStop(.42, "rgba(10,10,10,.92)"); sh.addColorStop(.56, "rgba(10,10,10,.6)"); sh.addColorStop(.72, "rgba(10,10,10,.12)"); sh.addColorStop(1, "rgba(10,10,10,0)")
  ctx.fillStyle = sh; ctx.fillRect(x, y, w, h)
  const tx = x + 30, size = 42, l1 = y + h / 2 - 8, l2 = l1 + size * 1.1
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.letterSpacing = `${(-.02 * size).toFixed(1)}px`
  ctx.font = `italic 400 ${size}px "Geist"`; ctx.fillStyle = "rgba(255,255,255,.65)"; ctx.fillText("Where", tx, l1)
  const ww = ctx.measureText("Where ").width
  ctx.font = `900 ${size}px "Geist"`; ctx.fillStyle = "#ffffff"; ctx.fillText("San Antonio", tx + ww, l1)
  const word = typed(t); ctx.fillText(word, tx, l2)
  const cx = tx + ctx.measureText(word).width + size * .06
  if (Math.floor(t / 1.1 * 2) % 2 === 0) { ctx.fillStyle = "#ef426f"; ctx.fillRect(cx, l2 - size * .72, size * .42, size * .78) }
  ctx.letterSpacing = "0px"
}
function screen(t) {
  const { x, y, w, h } = SCREEN, gap = 10, cw = (w - (COLS_N + 1) * gap) / COLS_N, ch = cw * 4 / 3
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip()
  ctx.fillStyle = "#0a0a0a"; ctx.fillRect(x, y, w, h)
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(2 * Math.PI / 180); ctx.scale(1.12, 1.12); ctx.translate(-w / 2, -h / 2)   // the hero's tilt
  COLUMNS.forEach((col, c) => {
    const len = col.length * (ch + gap), dir = c % 2 ? 1 : -1, off = ((t / T) * COL_CYCLES[c] * len) % len
    const cx = gap + c * (cw + gap)
    for (let k = -1; k <= Math.ceil(h / len) + 1; k++) col.forEach((im, i) => {
      const cy = (dir < 0 ? -off : off - len) + k * len + i * (ch + gap)
      if (cy > h + 40 || cy + ch < -40 || !im.complete || !im.naturalWidth) return
      ctx.save(); ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 10); ctx.clip(); ctx.drawImage(im, cx, cy, cw, ch); ctx.restore()
    })
  })
  ctx.restore()
  heroText(t)
  avgCtx.drawImage(ctx.canvas, x, y, w, h, 0, 0, 1, 1); const d = avgCtx.getImageData(0, 0, 1, 1).data; screenRGB = [d[0], d[1], d[2]]
  // soft edges: a vignette inside the frame, so the picture sits in the night rather than on it
  const v = ctx.createRadialGradient(x + w / 2, y + h / 2, h * .45, x + w / 2, y + h / 2, w * .62)
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.38)")
  ctx.fillStyle = v; ctx.fillRect(x, y, w, h)
  ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 6; ctx.strokeRect(x + 3, y + 3, w - 6, h - 6)
  const [r, gg, b] = screenRGB                          // its light: a glow round the frame and a wash on the lawn, in the photos' colour
  lit(() => { glow(x + w / 2, y + h / 2, w * .75, h * .9, `rgba(${r},${gg},${b},.16)`); glow(x + w / 2, GROUND + 120, 900, 240, `rgba(${r},${gg},${b},.10)`); glow(x + w / 2, 960, 1100, 150, `rgba(${r},${gg},${b},.09)`) })
}

// the twilight every photograph of the place has: deep blue going to an ember glow low behind the wall, laid over
// the sky's characters (so the stars still show) but not over the tower
function twilight() {
  const { x0, x1, top, sh } = TOWER
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, WALL.top)
  ctx.moveTo(x0 - 14, top - 30); ctx.lineTo(x0 - 14, sh); ctx.quadraticCurveTo(x0 - 20, WALL.top - 10, x0 - 130, WALL.top); ctx.lineTo(x1 + 130, WALL.top)
  ctx.quadraticCurveTo(x1 + 20, WALL.top - 10, x1 + 14, sh); ctx.lineTo(x1 + 14, top - 30); ctx.closePath(); ctx.clip("evenodd")
  ctx.globalCompositeOperation = "lighter"
  const gr = ctx.createLinearGradient(0, 240, 0, WALL.top)
  gr.addColorStop(0, "rgba(20,30,80,0)"); gr.addColorStop(.45, "rgba(30,40,110,.22)"); gr.addColorStop(.78, "rgba(150,60,70,.26)"); gr.addColorStop(1, "rgba(255,120,40,.42)")
  ctx.fillStyle = gr; ctx.fillRect(0, 240, W, WALL.top - 240); ctx.restore()
}
// ---- 3. Christmas on the plaza ----------------------------------------------------------------------
const XC = ["#e8323c", "#2fd06a", TEAL, PINK, ORANGE, GOLD]
function bulbs(pts, t, r = 3.6) {
  const n = beatN(t)
  pts.forEach(([x, y], i) => { const c = XC[(i + n) % 6]
    lit(() => glow(x, y, 10, 10, fm.rgba(c, .5))); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill() })
}
function lights(t) {
  const { x0, x1, top, sh } = TOWER, pts = []
  for (let x = x0 + 30; x <= x1 - 30; x += 24) pts.push([x, top - 38])                     // along the top of the cap
  for (let y = top + 6; y <= sh; y += 24) { pts.push([x0, y]); pts.push([x1, y]) }          // down both edges of the tower
  for (let k = 1; k <= 5; k++) { const u = k / 6, q = (a, b, c) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c   // along both shoulders' curves
    pts.push([q(x0, x0 - 20, x0 - 130), q(sh, WALL.top - 10, WALL.top) - 4]); pts.push([q(x1, x1 + 20, x1 + 130), q(sh, WALL.top - 10, WALL.top) - 4]) }
  for (let x = 12; x < W; x += 30) if (x < x0 - 130 || x > x1 + 130) pts.push([x, WALL.top - 4])   // along the wall's top
  bulbs(pts, t)
  // the two lamps on the tower's face, beside the screen
  for (const lx of [x0 + 20, x1 - 20]) { lit(() => glow(lx, 300, 26, 26, "rgba(120,255,190,.5)")); ctx.fillStyle = "#b8ffd8"; ctx.fillRect(lx - 4, 296, 8, 8) }
  // a wreath on the tower, between the cap and the screen's frame
  const cx = SCREEN.x + SCREEN.w / 2, cy = (TOWER.top + SCREEN.y - 20) / 2
  ctx.strokeStyle = "#1f8a46"; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, TAU); ctx.stroke()
  ctx.strokeStyle = "#2fa356"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, TAU); ctx.stroke()
  ;[0, 1, 2, 3, 4, 5].forEach(k => { const a = k / 6 * TAU; ctx.fillStyle = XC[k]; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 13, cy + Math.sin(a) * 13, 2.4, 0, TAU); ctx.fill() })
  ctx.fillStyle = "#e8323c"; ctx.fillRect(cx - 5, cy + 10, 10, 7)
  // the speakers on their stands at the stage's two ends
  for (const sx of [STAGE.cx - STAGE.rx + 40, STAGE.cx + STAGE.rx - 40]) { ctx.fillStyle = "#2a2a30"; ctx.fillRect(sx - 2, GROUND - 70, 4, 70); ctx.fillStyle = "#16161a"; ctx.fillRect(sx - 16, GROUND - 112, 32, 46)
    ctx.fillStyle = "#3a3a42"; ctx.beginPath(); ctx.arc(sx, GROUND - 82, 9, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(sx, GROUND - 102, 5, 0, TAU); ctx.fill() }
}
// paper luminarias along the lawn's front edge and up the side
function luminarias(t) {
  const pts = []; for (let x = 40; x < W; x += 120) pts.push([x, 1056])
  pts.forEach(([x, y], i) => {
    const fl = .75 + .15 * Math.sin(TAU * 7 * t / T + i * 2.1) + .1 * Math.sin(TAU * 13 * t / T + i)
    lit(() => glow(x, y - 16, 34, 26, `rgba(255,190,110,${(.4 * fl).toFixed(3)})`))
    ctx.fillStyle = `rgba(245,214,160,${(.85 * fl).toFixed(3)})`; ctx.fillRect(x - 12, y - 30, 24, 30)
    ctx.fillStyle = "rgba(120,70,30,.5)"; ctx.fillRect(x - 12, y - 30, 24, 3)
  })
}

// ---- 4. the audience, from behind; the cocoa stand -------------------------------------------------------
const SKINS = [["#f2cfae", "#d9ab86"], ["#c2875a", "#a06c44"], ["#6e4428", "#55331e"], ["#e0a87e", "#c48a60"]]
function blanket(x, y, w, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w / 2 - 30, y - 34); ctx.lineTo(x - w / 2 + 30, y - 34); ctx.closePath(); ctx.fill()
  ctx.fillStyle = "rgba(255,255,255,.18)"; for (let k = 1; k < 5; k++) ctx.fillRect(x - w / 2 + k * w / 5, y - 34, 4, 34)
}
// a camp chair from behind, in pixels: the fabric back sagging at its foot, the frame, an armrest each side (a cup
// holder on the left), the crossed legs. F fabric, f its shadow, b a seam, M the frame, C the cup holder's mesh
const CHAIR = [
  "..M............M..", "..MFFFFFFFFFFFFM..", "..MFFFFFFFFFFFFM..", "..MFbFFFFFFFFbFM..", "..MFFFFFFFFFFFFM..", "..MFFFFFFFFFFFFM..",
  "..MFFFFFFFFFFFFM..", "CCMFFFFFFFFFFFFMFF", "CCMfFFFFFFFFFFfMFF", "..MffFFFFFFFFffM..", "..MMfffFFFFfffMM..",
  "..MM..........MM..", "....MM......MM....", "......MM..MM......", "....MM......MM....", "..MM..........MM.."]
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = c => Math.round(c * k); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})` }
function chair(x, base, px, c, drape) {
  const [w, h] = xs.size(CHAIR, px)
  xs.spr(ctx, CHAIR, { F: c, f: shade(c, .7), b: shade(c, 1.25), M: "#3a3c44", C: "#1e1f24" }, x - w / 2, base - h, px)
  if (drape) {                                            // saved for a friend: a plaid blanket thrown over its back
    const DR = ["..PPPPPPPPPPPPPP..", "..PpPPpPPpPPpPPP..", "..PPPPPPPPPPPPPP..", "..PPpPPpPPpPPpPP..", "...PPPPP..PPPPP...", "....PPP....PPP....", "....PP......PP...."]
    xs.spr(ctx, DR, { P: drape, p: "#f4efe6" }, x - w / 2, base - h, px)
  }
}

// an elf from behind, sitting: the sprite's hat and coat, hair where its face was, no legs (tucked under)
const HAIR = ["#3a2418", "#1a1412", "#7a3b1e"]
const ELF_BACK = xs.ELF.slice(0, 15).map((row, r) => r === 6 ? "..S.hhhhhh.S.." : r === 7 ? "..ShhhhhhhhS.." : r === 8 ? "....hhhhhh...." : r === 11 ? "..EEEEEEEEEE.." : row)
function elfBack(x, base, c, sk, hair, px = 5) { const [w, h] = xs.size(ELF_BACK, px); xs.spr(ctx, ELF_BACK, { ...xs.PAL, E: c, S: SKINS[sk][0], s: SKINS[sk][1], h: hair }, x - w / 2, base - h, px) }
// three rows of chairs going back toward the screen, smaller as they go: [x, colour, who sits in it]. Who: an elf
// [coat, skin, hair], an agent's tint, "drape:<colour>" for one saved for a friend, or empty
const ROWS3 = [
  { base: 792, px: 3, seats: [[430, "#c8323c", ["e", PINK, 0, 1]], [540, "#2f5fb0", null], [1250, "#b8508f", ["a", ORANGE]], [1360, "#6a4aa0", ["e", TEAL, 3, 0]], [1470, "#c8323c", "drape:#2f6d3b"], [1590, "#2f5fb0", ["a", TEAL]], [1700, "#b8508f", null]] },
  { base: 884, px: 4, seats: [[460, "#6a4aa0", ["a", PINK]], [1060, "#2f5fb0", ["e", ORANGE, 1, 2]], [1190, "#c8323c", ["a", TEAL, "whisper"]], [1320, "#b8508f", ["a", PINK, "whisperee"]], [1480, "#2f5fb0", "drape:#7a1f2b"], [1640, "#6a4aa0", ["e", "#d8343c", 2, 1]]] },
  { base: 1000, px: 5, seats: [[430, "#c8323c", ["a", ORANGE, "cheer"]], [580, "#b8508f", "drape:#1f4f46"], [1190, "#6a4aa0", ["e", TEAL, 0, 2, "blanket"]], [1360, "#2f5fb0", null], [1530, "#c8323c", ["a", TEAL]], [1700, "#b8508f", ["e", PINK, 3, 1]]] }]
// the moments: a whisper (t 24 to 31), a blanket pulled up (t 78 to 108), a cheer each time "Builds." finishes typing
const whisper = t => Math.sin(Math.PI * fm.clamp01((t - 24) / 7))
const cheer = t => { const u = t % CYCLE - WORD_T[0].type; return u > 0 && u < 1.4 ? 1 : 0 }
function seat(x, base, px, who, t, k) {
  if (!who) return
  const seatY = base - 9 * px                             // high enough that heads and shoulders clear the chair's back
  if (who[0] === "e") { elfBack(x, seatY, who[1], who[2], HAIR[who[3]], px)
    if (who[4] === "blanket") { const up = fm.ease(fm.clamp01((t - 78) / 2.5)) * (1 - fm.ease(fm.clamp01((t - 106) / 2.5)))   // pulled up over the shoulders, later let down
      ctx.fillStyle = "#2f6d3b"; ctx.fillRect(x - 6 * px, seatY - (5 + 5 * up) * px, 12 * px, (5 + 5 * up) * px); ctx.fillStyle = "#f4efe6"; for (let q = 0; q < 3; q++) ctx.fillRect(x - 6 * px, seatY - (4 + 5 * up) * px + q * 3 * px, 12 * px, Math.max(1, px * .4)) }
    return }
  const lean = who[2] === "whisper" ? .3 * whisper(t) : who[2] === "whisperee" ? -.08 * whisper(t) : 0
  drawPlush(ctx, { x, y: seatY + 2 * px, s: px * .14, tint: who[1], number: "", t, back: true, seed: k * 5 + 1, lean, armsUp: who[2] === "cheer" ? cheer(t) : 0 })
}
// the cocoa run, once a loop: the elf on the left of the red blanket gets up, walks to the stand, waits while the
// penguin pours, and walks back with a steaming cup. Returns where it is, or null while it sits
const RUN = { t0: 40, walk: 9, wait: 4, home: 700, stand: 350, base: 900 }
function cocoaRun(t) {
  const u = t - RUN.t0, { walk, wait } = RUN; if (u < 0 || u > 2 * walk + wait) return null
  const out = u < walk, back = u > walk + wait, p = out ? fm.ease(u / walk) : back ? fm.ease((u - walk - wait) / walk) : 1
  const x = out ? lerp(RUN.home, RUN.stand, p) : back ? lerp(RUN.stand, RUN.home, p) : RUN.stand
  return { x, moving: out || back, cup: u > walk + 1.5, dir: out ? -1 : 1 }
}
function walker(t) {
  const r = cocoaRun(t); if (!r) return
  const px = 5, step = r.moving ? Math.floor(t * 4) % 2 : 0, map = step ? xs.ELF_STEP : xs.ELF, [w, h] = xs.size(map, px)
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(r.x, RUN.base + 6, 26, 6, 0, 0, TAU); ctx.fill()
  xs.spr(ctx, map, { ...xs.PAL, E: PINK, S: SKINS[1][0], s: SKINS[1][1] }, r.x - w / 2, RUN.base + 6 - h, px, { flip: r.dir < 0 })
  if (r.cup) { const cx = r.x + r.dir * 30, cy = RUN.base + 6 - h + 12 * px
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(cx - 7, cy, 14, 16); ctx.fillStyle = TEAL; ctx.fillRect(cx - 7, cy + 4, 14, 3)
    for (let s2 = 0; s2 < 3; s2++) { const q = ((t * .8) + s2 / 3) % 1; ctx.fillStyle = `rgba(255,255,255,${(.4 * (1 - q)).toFixed(3)})`; ctx.fillRect(Math.round(cx + Math.sin(q * 6) * 4), Math.round(cy - 4 - q * 30), 3, 3) } }
}
function audience(t) {
  ROWS3.slice(0, 1).forEach(({ base, px, seats }, ri) => seats.forEach(([x, c, who], k) => { const d = typeof who === "string" ? who.slice(6) : null; seat(x, base, px, d ? null : who, t, k + ri * 10); chair(x, base, px, c, d) }))
  // the red blanket between the rows: the two elves watching, one of them off for cocoa once a loop
  blanket(760, 900, 320, "#7a1f2b")
  if (!cocoaRun(t)) elfBack(RUN.home, 892, PINK, 1, HAIR[0]); elfBack(820, 892, TEAL, 2, HAIR[1])
  ROWS3.slice(1, 2).forEach(({ base, px, seats }) => seats.forEach(([x, c, who], k) => { const d = typeof who === "string" ? who.slice(6) : null; seat(x, base, px, d ? null : who, t, k + 10); chair(x, base, px, c, d) }))
  walker(t)                                                // the cocoa run passes between the middle and front rows
  ROWS3.slice(2).forEach(({ base, px, seats }) => seats.forEach(([x, c, who], k) => { const d = typeof who === "string" ? who.slice(6) : null; seat(x, base, px, d ? null : who, t, k + 20); chair(x, base, px, c, d) }))
}
// the hot cocoa stand at the left, kept by the penguin
function cocoa(t) {
  const x = 210, base = 860
  if (PENGUIN.complete && PENGUIN.naturalWidth) { const h = 120, w = h * PENGUIN.naturalWidth / PENGUIN.naturalHeight, bob = Math.abs(Math.sin(TAU * BPM / 60 * (t - OFFSET) / 2)) * 3
    ctx.imageSmoothingEnabled = false; ctx.drawImage(PENGUIN, x - w / 2, base - 40 - h - bob, w, h); ctx.imageSmoothingEnabled = true }   // behind the counter, its feet hidden
  ctx.fillStyle = "#5e3b24"; ctx.fillRect(x - 110, base - 80, 220, 80); ctx.fillStyle = GOLD; ctx.fillRect(x - 110, base - 80, 220, 5)
  ctx.fillStyle = "#101216"; ctx.fillRect(x - 116, base - 76, 232, 40)
  ctx.fillStyle = "#f4efe6"; ctx.font = '700 18px "Geist Mono"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.letterSpacing = "3px"
  ctx.fillText("COCOA", x, base - 56); ctx.letterSpacing = "0px"
  for (let k = 0; k < 4; k++) {                          // cups on the counter, steam rising a whole number of times a loop
    const cx = x - 66 + k * 44; ctx.fillStyle = "#f4f4f4"; ctx.fillRect(cx - 9, base - 100, 18, 20); ctx.fillStyle = XC[k + 2]; ctx.fillRect(cx - 9, base - 94, 18, 4)
    for (let s = 0; s < 3; s++) { const u = ((t / T) * 12 + k * .3 + s / 3) % 1; ctx.fillStyle = `rgba(255,255,255,${(.35 * (1 - u)).toFixed(3)})`; ctx.fillRect(Math.round(cx + Math.sin(u * 6 + k) * 5), Math.round(base - 104 - u * 46), 4, 4) }
  }
  const r = cocoaRun(t)                                   // a cup held out over the counter while the elf waits
  if (r && !r.moving && t - RUN.t0 < RUN.walk + 1.5) { ctx.fillStyle = "#f4f4f4"; ctx.fillRect(x + 96, base - 112, 14, 16); ctx.fillStyle = TEAL; ctx.fillRect(x + 96, base - 108, 14, 3) }
  // its string of bulbs over the counter
  const pts = []; for (let k = 0; k < 9; k++) pts.push([x - 104 + k * 26, base - 128 + Math.sin(k / 8 * Math.PI) * 10]); bulbs(pts, t, 3)
}
// Santa's sleigh and four reindeer across the sky once a loop, passing behind the tower's top
function sleigh(t) {
  const dur = 20, t0 = T * .55, u = (t - t0) / dur; if (u < 0 || u > 1) return
  const x = lerp(W + 500, -700, u), y = 70 + Math.sin(u * TAU * 2) * 12, px = 4
  for (let k = 1; k <= 4; k++) { const [w, h] = xs.size(xs.DEER, px), leap = Math.floor(t * 6 + k) % 2, rx = x - 90 - k * 80
    xs.spr(ctx, leap ? xs.DEER_LEAP : xs.DEER, { ...xs.PAL, N: xs.NOSE[k % 3] }, rx - w / 2, y - h + (leap ? -2 * px : 0), px, { flip: true }) }
  const [sw, sh] = xs.size(xs.SLEIGH, px)
  xs.spr(ctx, xs.SANTA_SEATED, xs.PAL, x - sw / 2 + 6 * px, y - sh - 13 * px, px, { flip: true }); xs.spr(ctx, xs.SLEIGH, xs.PAL, x - sw / 2, y - sh, px, { flip: true })
  ctx.save(); ctx.globalCompositeOperation = "lighter"
  for (let k = 1; k < 24; k++) { ctx.fillStyle = [GOLD, TEAL, PINK, ORANGE][k % 4]; ctx.globalAlpha = 1 - k / 24; ctx.fillRect(x + sw / 2 + k * 14, y - 20 + Math.sin(k + t * 9) * 8, 4, 4) }
  ctx.restore()
}
// pixel snow: the desk's six-armed flake and specks, seamless
const FLAKE = ["...#...", "#..#..#", ".#.#.#.", "..###..", "#######", "..###..", ".#.#.#.", "#..#..#", "...#..."]
const FLAKES = Array.from({ length: 60 }, (_, i) => { const kind = i % 10 < 6 ? 0 : i % 10 < 9 ? 1 : 2
  return { x: hash(i, 31) * W, ph: hash(i, 32), laps: kind === 2 ? 1 : 2, sw: 10 + hash(i, 33) * 30, kind, px: [4, 2, 4][kind], a: [.5, .6, .85][kind] } })
function snow(t) {
  for (const f of FLAKES) {
    const h = f.kind ? 9 * f.px : f.px, k = ((t / T) * f.laps + f.ph) % 1, y = Math.round((-h + k * (H + 2 * h)) / f.px) * f.px
    const x = Math.round((f.x + Math.sin(TAU * f.laps * t / T + f.ph * 6) * f.sw) / f.px) * f.px
    ctx.fillStyle = `rgba(255,255,255,${f.a})`
    if (!f.kind) { ctx.fillRect(x, y, f.px, f.px); continue }
    FLAKE.forEach((row, ry) => [...row].forEach((c, rx) => { if (c === "#") ctx.fillRect(x + rx * f.px, y + ry * f.px, f.px, f.px) }))
  }
}
window.FOOTER_SPRITE = (x, bottom, t) => { xs.radio(ctx, x, bottom - xs.RADIO.length * 3, 3, beatPh(t) / 4 + Math.floor((t - OFFSET) * BPM / 60 % 4 + 4) % 4 / 4); return 26 * 3 }

function render(t) {
  paint(t)
  fm.ascii("#07080c", towerTint)
  twilight()
  sleigh(t)
  screen(t)
  lights(t)
  cocoa(t)
  audience(t)
  luminarias(t)
  snow(t)
  footer(t)
}
fm.start(render, [heroReady, penguinReady, document.fonts.load('900 50px "Geist"'), document.fonts.load('italic 400 50px "Geist"')])
</script>
</body>
