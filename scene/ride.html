<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  html, body { margin: 0; background: #0c0c0c; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, the ride: the back seat of a driverless taxi at night, heading downtown. Through the
  windshield, drawn in characters, the street runs toward the Tower of the Americas: buildings
  with lit windows and streetlamps slide past on both sides, a car keeps its distance ahead, and
  now and then headlights come the other way. In the cabin the two front seats are empty and there
  is no wheel. The screen on the dash shows the route to Geekdom and what the car sees, lanes and
  boxes. Each streetlamp washes through the cabin as it passes.

  The car is our own: no maker's name, badge or styling.

  Synced (render.cjs SYNC=...): the loop is the song, with the song inside it; the ambient strip
  along the dash pulses on the real beat. Everything else runs on ~60 s cycles, a whole number per
  loop (LT). 1920x1080, a seamless T-second loop: render(t) draws a frame.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const B = window.BEATS || null
const T = window.LOOP_T || 60, W = 1920, H = 1080, TAU = Math.PI * 2
const LT = T / Math.max(1, Math.round(T / 60))
const cycles = k => Math.max(1, Math.round(k * LT / 60))
const TEAL = "#00b2a9", PINK = "#ef426f", ORANGE = "#ff8200"
const BPM = B ? B.bpm : 76, OFFSET = B ? B.offset : 0
const beatPh = t => { const bc = (t - OFFSET) * BPM / 60; return bc - Math.floor(bc) }
const pulseAt = t => Math.exp(-beatPh(t) * 3.5)
const clamp = x => Math.max(0, Math.min(1, x))
const ctx = document.getElementById("c").getContext("2d")
const CELL = 12, COLS = W / CELL, ROWS = H / CELL      // 160 x 90 characters
const RAMP = " .,:;-=+*#%@"

const sc = document.createElement("canvas"); sc.width = COLS; sc.height = ROWS
const g = sc.getContext("2d", { willReadFrequently: true })
const gray = v => { const c = Math.round(clamp(v) * 255); return `rgb(${c},${c},${c})` }
function box(x, y, w, h, v) { g.fillStyle = gray(v); g.fillRect(x, y, w, h) }

// the Tower of the Americas, from the City of San Antonio's icons, at the end of the street
let TOWER = null
async function loadTower() {
  let svg = await (await fetch("icons/tower.svg")).text()
  const vb = svg.match(/viewBox="([^"]+)"/)[1].split(/\s+/).map(Number)
  svg = svg.replace(/#231f20/gi, "#ffffff").replace(/stroke-width:\s*[^;]+;/g, "").replace(/stroke:\s*#ffffff;/g, `stroke: #ffffff; stroke-width: ${(vb[2] / 12) * 1.1}px;`)
  const im = new Image(); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)
  await new Promise(r => { im.onload = r; im.onerror = r }); TOWER = { im, vb }
}

// the street in perspective: depth z (1 is a car length or so ahead), lateral X in lane widths.
// screen x = VX + X * F / z, the road at y = VY + CAM / z
const VX = 80, VY = 36, F = 1.15, CAM = 2.3
const sx = (X, z) => VX + X * F / z
const sy = z => VY + CAM / z
const ZN = .09, ZF = 4.2                                 // nearest and farthest depth drawn
// everything slides toward us at one speed, a whole number of passes per loop
const SPAN = 4, PASS = cycles(14)                        // an object passes every LT/PASS seconds
const zAt = (t, phase) => ZN + ((phase - (t / LT) * PASS * SPAN) % SPAN + SPAN) % SPAN
// buildings down both sides: [side, phase, width, height, seed]
const BUILDINGS = [[-1, .3, 1.6, 2.6, 1], [-1, 1.3, 1.2, 3.6, 2], [-1, 2.2, 1.8, 2.1, 3], [-1, 3.3, 1.4, 4.2, 4],
                   [1, .8, 1.5, 3.1, 5], [1, 1.8, 1.9, 2.4, 6], [1, 2.8, 1.3, 4.0, 7], [1, 3.7, 1.7, 2.8, 8]]
const LAMPS = [0, 1, 2, 3].map(i => i * 1)               // a streetlamp each side every unit of depth

function paint(t) {
  box(0, 0, COLS, ROWS, .03)
  // stars over the street, and the Tower at the end of it with its beacon
  let st = 3; const sr = () => (st = (st * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 50; i++) { const x = Math.floor(sr() * COLS), y = Math.floor(sr() * 30), ph = sr() * TAU
    box(x, y, 1, 1, .24 + .26 * sr() + .14 * Math.sin(TAU * cycles(2) * t / LT + ph)) }
  if (TOWER) { const w = 13, h = w * TOWER.vb[3] / TOWER.vb[2]
    g.save(); g.globalAlpha = .9; g.drawImage(TOWER.im, VX - w / 2, VY + 1 - h, w, h); g.restore()
    box(VX, Math.round(VY - h), 1, 1, .35 + .65 * (.5 + .5 * Math.sin(TAU * cycles(15) * t / LT))) }
  // the far skyline either side of the Tower
  for (let x = 0; x < COLS; x += 3) { const hgt = 2 + Math.abs(Math.sin(x * .7) * 5 + Math.sin(x * .23) * 3); if (Math.abs(x - VX) > 8) box(x, VY - hgt, 3, hgt, .1) }

  // the road: a dark wedge to the bottom, its kerbs, and the lane lines streaming toward us
  g.fillStyle = gray(.12); g.beginPath(); g.moveTo(sx(-2, ZF), sy(ZF)); g.lineTo(sx(2, ZF), sy(ZF)); g.lineTo(sx(2, ZN), sy(ZN)); g.lineTo(sx(-2, ZN), sy(ZN)); g.closePath(); g.fill()
  g.strokeStyle = gray(.4); g.lineWidth = .8
  for (const X of [-2, 2]) { g.beginPath(); g.moveTo(sx(X, ZF), sy(ZF)); g.lineTo(sx(X, ZN), sy(ZN)); g.stroke() }
  for (let k = 0; k < 16; k++) {                          // the dashes: 4 a unit of depth, so they loop with everything else
    const z0 = zAt(t, k / 4), z1 = z0 + .12
    if (z0 < ZN || z1 > ZF) continue
    for (const X of [0]) { g.strokeStyle = gray(.7); g.lineWidth = Math.max(.6, .5 / z0); g.beginPath(); g.moveTo(sx(X, z1), sy(z1)); g.lineTo(sx(X, z0), sy(z0)); g.stroke() }
  }
  // the sidewalks
  for (const side of [-1, 1]) { g.fillStyle = gray(.07); g.beginPath(); g.moveTo(sx(2 * side, ZF), sy(ZF)); g.lineTo(sx(3.2 * side, ZF), sy(ZF)); g.lineTo(sx(3.2 * side, ZN), sy(ZN)); g.lineTo(sx(2 * side, ZN), sy(ZN)); g.closePath(); g.fill() }

  // the far side first: sort everything by depth and draw back to front
  const things = []
  for (const [side, ph, w, h, seed] of BUILDINGS) things.push({ z: zAt(t, ph), draw: z => building(side, z, w, h, seed, t) })
  for (const ph of LAMPS) for (const side of [-1, 1]) things.push({ z: zAt(t, ph + .5), draw: z => lamp(side, z) })
  things.sort((a, b) => b.z - a.z).forEach(o => o.draw(o.z))

  // the pools of light the lamps throw on the road
  g.save(); g.globalCompositeOperation = "lighten"
  for (const ph of LAMPS) for (const side of [-1, 1]) { const z = zAt(t, ph + .5); if (z > 3) continue
    const r = .9 / z, pool = g.createRadialGradient(sx(1.6 * side, z), sy(z), 0, sx(1.6 * side, z), sy(z), r)
    pool.addColorStop(0, gray(.42)); pool.addColorStop(1, gray(.1)); g.fillStyle = pool
    g.beginPath(); g.ellipse(sx(1.6 * side, z), sy(z), r, r * .3, 0, 0, TAU); g.fill() }
  g.restore()
}
function building(side, z, w, h, seed, t) {
  if (z > ZF) return
  const near = sx(3.4 * side, z), far = sx((3.4 + w) * side, z), top = sy(z) - h * F / z * 1.6, base = sy(z)
  const x0 = Math.min(near, far), bw = Math.abs(far - near)
  box(x0, top, bw, base - top, .1 + .05 * (seed % 3))
  // lit windows, a grid that scales with the building
  const step = Math.max(1, .5 / z)
  for (let yy = top + step; yy < base - step; yy += step * 1.4) for (let xx = x0 + step * .6; xx < x0 + bw - step * .6; xx += step * 1.2) {
    const k = Math.floor(xx * 3 + yy * 7 + seed * 13)
    if ((k * 2654435761 >>> 0) % 7 < 3) box(xx, yy, Math.max(1, step * .5), Math.max(1, step * .5), .36 + .1 * Math.sin(TAU * cycles(1) * t / LT + k))
  }
}
function lamp(side, z) {
  if (z > ZF) return
  const x = sx(2.4 * side, z), base = sy(z), top = base - 2.6 * F / z, w = Math.max(.6, .12 / z)
  box(x, top, w, base - top, .4)
  box(Math.min(x, x - side * .9 / z), top, .9 / z, w, .4)
  box(x - side * .9 / z - .25 / z, top, .5 / z, Math.max(1, .25 / z), 1)
}

// a car ahead, keeping its distance; headlights coming the other way, twice a cycle
const leadZ = t => 1.15 + .12 * Math.sin(TAU * cycles(3) * t / LT)
function traffic(t) {
  const px = (X, z) => sx(X, z) * CELL, py = z => sy(z) * CELL
  // the car ahead: a dark body, two red lights, brighter when it slows
  const z = leadZ(t), w = 1.4 * F / z * CELL, h = .9 * F / z * CELL, x = px(.9, z), y = py(z)
  const braking = Math.sin(TAU * cycles(3) * t / LT) > .5 ? 1 : 0
  ctx.fillStyle = "#121318"; ctx.fillRect(x - w / 2, y - h, w, h * .92)
  ctx.save(); ctx.globalCompositeOperation = "lighter"
  for (const dx of [-.38, .38]) { const lx = x + dx * w, ly = y - h * .55
    ctx.fillStyle = braking ? "#ff4040" : "#c42a2a"; ctx.fillRect(lx - w * .09, ly - h * .06, w * .18, h * .12)
    const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, w * (braking ? .5 : .3)); gr.addColorStop(0, `rgba(255,60,50,${braking ? .5 : .28})`); gr.addColorStop(1, "rgba(255,60,50,0)")
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lx, ly, w * .5, 0, TAU); ctx.fill() }
  // oncoming headlights, in the far lane
  const u = ((t / LT) * cycles(2)) % 1
  if (u < .3) {
    const zo = 4 - (u / .3) * 3.85, xo = px(-.9, zo), yo = py(zo), s = 1 / zo
    for (const dx of [-.45, .45]) { const lx = xo + dx * s * CELL * 1.2, ly = yo - s * CELL * .5
      const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, 26 * s + 10); gr.addColorStop(0, "rgba(255,245,220,.85)"); gr.addColorStop(1, "rgba(255,245,220,0)")
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(lx, ly, 26 * s + 10, 0, TAU); ctx.fill() }
  }
  ctx.restore()
}

// the cabin, over the view: the roof and pillars around the windshield, the dash, the empty front seats, the screen
const GLASS = [[300, 96], [1620, 96], [1790, 690], [130, 690]]       // the windshield's corners
function cabin(t) {
  // how much a passing streetlamp lights the cabin, and from which side
  let wash = 0, from = 0
  for (const ph of LAMPS) for (const side of [-1, 1]) { const z = zAt(t, ph + .5); if (z < .5) { const k = Math.exp(-((z - .2) ** 2) / .01); if (k > wash) { wash = k; from = side } } }

  // the shell: everything outside the windshield, dark
  ctx.save()
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.moveTo(...GLASS[0]); GLASS.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath()
  const shell = ctx.createLinearGradient(0, 0, 0, H); shell.addColorStop(0, "#0d0e11"); shell.addColorStop(1, "#08090b")
  ctx.fillStyle = shell; ctx.fill("evenodd")
  ctx.restore()
  // the glass itself: a faint tint and the dash reflected low in it
  ctx.save(); ctx.beginPath(); ctx.moveTo(...GLASS[0]); GLASS.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); ctx.clip()
  const tint = ctx.createLinearGradient(0, 96, 0, 690); tint.addColorStop(0, "rgba(10,20,40,.25)"); tint.addColorStop(1, "rgba(10,20,40,0)")
  ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.restore()
  // the pillars' edges and the mirror
  ctx.strokeStyle = "#1c1e24"; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(...GLASS[0]); ctx.lineTo(...GLASS[3]); ctx.moveTo(...GLASS[1]); ctx.lineTo(...GLASS[2]); ctx.stroke()
  ctx.fillStyle = "#121318"; ctx.beginPath(); ctx.roundRect(880, 104, 160, 40, 12); ctx.fill()
  ctx.fillStyle = "#1b1d22"; ctx.fillRect(956, 96, 8, 10)

  // the dash: a long low shelf under the glass, and the ambient strip along it on the beat
  ctx.fillStyle = "#101114"; ctx.beginPath(); ctx.moveTo(100, 690); ctx.lineTo(1820, 690); ctx.lineTo(1920, 780); ctx.lineTo(0, 780); ctx.closePath(); ctx.fill()
  const amb = .35 + .55 * pulseAt(t), strip = ctx.createLinearGradient(160, 0, 1760, 0)
  strip.addColorStop(0, TEAL); strip.addColorStop(.5, PINK); strip.addColorStop(1, ORANGE)
  ctx.save(); ctx.globalAlpha = amb; ctx.fillStyle = strip; ctx.fillRect(160, 700, 1600, 4)
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = amb * .25; ctx.fillRect(160, 690, 1600, 26); ctx.restore()

  // the two front seats, empty: headrests and the tops of the seat backs, lit from the side as a lamp goes by
  for (const cx of [560, 1360]) {
    const lit = wash * (from * (cx - 960) > 0 ? .5 : .25)
    const seat = ctx.createLinearGradient(cx - 230, 0, cx + 230, 0)
    const edge = `rgba(${40 + 120 * lit},${42 + 110 * lit},${48 + 90 * lit},1)`, mid = "#17181c"
    if (from < 0) { seat.addColorStop(0, edge); seat.addColorStop(1, mid) } else { seat.addColorStop(0, mid); seat.addColorStop(1, edge) }
    ctx.fillStyle = seat
    ctx.beginPath(); ctx.roundRect(cx - 230, 790, 460, 400, 60); ctx.fill()          // the seat back
    ctx.beginPath(); ctx.roundRect(cx - 110, 640, 220, 130, 40); ctx.fill()          // the headrest
    ctx.fillStyle = "#0a0b0d"; ctx.fillRect(cx - 50, 770, 12, 26); ctx.fillRect(cx + 38, 770, 12, 26)   // its posts
    ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 180, 900); ctx.lineTo(cx + 180, 900); ctx.stroke()
  }
  // the screen on the dash, between the seats
  screen(t, 790, 720, 340, 210)

  // the lamp's light through the cabin: a soft sweep from its side
  if (wash > .02) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"
    const lx = from < 0 ? 0 : W, gr = ctx.createRadialGradient(lx, 380, 0, lx, 380, 1300)
    gr.addColorStop(0, `rgba(255,214,160,${(.16 * wash).toFixed(3)})`); gr.addColorStop(1, "rgba(255,214,160,0)")
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.restore()
  }
}

// the screen: the route to Geekdom on the left, what the car sees on the right
function screen(t, x, y, w, h) {
  ctx.save()
  ctx.fillStyle = "#050608"; ctx.beginPath(); ctx.roundRect(x - 6, y - 6, w + 12, h + 12, 16); ctx.fill()
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.clip()
  ctx.fillStyle = "#0e1116"; ctx.fillRect(x, y, w, h)
  const mw = w * .52, top = y + 34
  // the map: streets sliding down under a fixed arrow, the route in teal turning toward the pin
  ctx.save(); ctx.beginPath(); ctx.rect(x, top, mw, h - 34); ctx.clip()
  const slide = ((t / LT) * cycles(6) * 40) % 40
  ctx.strokeStyle = "#1f2530"; ctx.lineWidth = 6
  for (let yy = top - 40 + slide; yy < y + h; yy += 40) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + mw, yy); ctx.stroke() }
  for (const xx of [x + 30, x + 88, x + 146]) { ctx.beginPath(); ctx.moveTo(xx, top); ctx.lineTo(xx, y + h); ctx.stroke() }
  ctx.strokeStyle = TEAL; ctx.lineWidth = 5; ctx.lineCap = "round"
  ctx.beginPath(); ctx.moveTo(x + 88, y + h); ctx.lineTo(x + 88, top + 30); ctx.lineTo(x + 146, top + 30); ctx.stroke()
  ctx.fillStyle = PINK; ctx.beginPath(); ctx.arc(x + 146, top + 30, 7, 0, TAU); ctx.fill()
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(x + 88, y + h - 46); ctx.lineTo(x + 78, y + h - 24); ctx.lineTo(x + 88, y + h - 30); ctx.lineTo(x + 98, y + h - 24); ctx.closePath(); ctx.fill()
  ctx.restore()
  // what the car sees: its lane, the car ahead as a box, the oncoming one when it's there
  const vx = x + mw + 10, vw = w - mw - 20, cx = vx + vw / 2
  ctx.strokeStyle = "rgba(160,200,255,.45)"; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(cx - 8, top + 10); ctx.lineTo(cx - 60, y + h - 8); ctx.moveTo(cx + 8, top + 10); ctx.lineTo(cx + 60, y + h - 8); ctx.stroke()
  const lz = leadZ(t), ly = top + 10 + (y + h - top - 18) * (1 - (lz - .8) / 1.2) * .55
  ctx.strokeStyle = TEAL; ctx.lineWidth = 2; ctx.strokeRect(cx + 4, ly, 26, 18)
  const u = ((t / LT) * cycles(2)) % 1
  if (u < .3) { const k = u / .3; ctx.strokeStyle = ORANGE; ctx.strokeRect(cx - 34 - 30 * k, top + 14 + k * (h - 70), 22 + 14 * k, 14 + 10 * k) }
  ctx.fillStyle = "#fff"; ctx.fillRect(cx - 8, y + h - 30, 16, 22)
  // the bar across the top: where it's going and when it gets there
  ctx.fillStyle = "#161a21"; ctx.fillRect(x, y, w, 30)
  ctx.font = '700 13px "Geist Mono"'; ctx.textBaseline = "middle"; ctx.textAlign = "left"; ctx.fillStyle = "#f2f2f2"
  ctx.fillText("→ Geekdom", x + 12, y + 16)
  const mins = 6 - Math.floor(((t % LT) / LT) * 6)
  ctx.textAlign = "right"; ctx.fillStyle = TEAL; ctx.fillText(`${mins} min`, x + w - 12, y + 16)
  ctx.restore()
}

function render(t) {
  t = ((t % T) + T) % T
  paint(t)
  const d = g.getImageData(0, 0, COLS, ROWS).data
  ctx.fillStyle = "#0c0c0c"; ctx.fillRect(0, 0, W, H)
  ctx.font = `700 ${CELL + 1}px "Geist Mono"`; ctx.textAlign = "center"; ctx.textBaseline = "middle"
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = d[(y * COLS + x) * 4] / 255
    const ch = RAMP[Math.min(RAMP.length - 1, Math.floor(v * RAMP.length))]
    if (ch === " ") continue
    ctx.fillStyle = `rgba(235,235,235,${(.25 + v * .75).toFixed(2)})`
    ctx.fillText(ch, x * CELL + CELL / 2, y * CELL + CELL / 2 + 1)
  }
  traffic(t)
  cabin(t)

  // footer: who this is, and the music credit
  const cr = window.CREDITS && window.CREDITS.length ? window.CREDITS : ['"Tejano Lofi" by Patrick · made with Suno']
  const ln = cr[Math.floor(t / 15) % cr.length]
  ctx.textAlign = "right"; ctx.textBaseline = "alphabetic"
  ctx.font = '500 20px "Geist"'; ctx.fillStyle = "rgba(255,255,255,0.75)"
  ctx.fillText("♪  " + ln, W - 60, H - 52)
  ctx.textAlign = "left"; ctx.font = '700 22px "Geist Mono"'; ctx.fillStyle = "rgba(255,255,255,0.8)"
  ctx.letterSpacing = "3px"; ctx.fillText("DEVSA FM  ·  devsa.community", 60, H - 52); ctx.letterSpacing = "0px"
  const tw = 46
  ;[TEAL, PINK, ORANGE].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(60 + i * (tw + 6), H - 40, tw, 6) })
}

window.render = render
window.ready = Promise.all([document.fonts.load('700 20px "Geist Mono"'), document.fonts.load('500 20px "Geist"'), loadTower()])
  .then(() => { paint(0); return new Promise(r => setTimeout(r, 300)) })
window.ready.then(() => {
  if (new URLSearchParams(location.search).has("still")) return render(8)
  const t0 = performance.now()
  ;(function loop() { render((performance.now() - t0) / 1000); requestAnimationFrame(loop) })()
})
</script>
</body>
</html>
