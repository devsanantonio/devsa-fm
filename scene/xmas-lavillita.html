<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Mono"; font-weight: 700; src: url(fonts/GeistMono-Bold.woff2) format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 500; src: url(fonts/Geist-Medium.woff2) format("woff2"); }
  @font-face { font-family: "Oswald"; font-weight: 700; src: url(fonts/Oswald-700.ttf) format("truetype"); }
  html, body { margin: 0; background: #07080c; overflow: hidden }
  canvas { display: block }
</style>
</head>
<body>
<!--
  DEVSA FM, the market at La Villita: a holiday market at night in downtown San Antonio's old village. In ASCII:
  La Villita's small flat-roofed stone houses along the back (deep-set doors and windows, a few lit), a big oak's
  canopy over them, the plaza's flagstones in front. In colour: four market stalls with striped awnings in the tab
  colours and gold trim, their goods in pixels (gifts, ornaments, conchas, candles), papel picado, string lights
  criss-crossing overhead and pulsing on the beat, paper luminarias along the ground. Elves stroll and shop, some
  carrying gifts; DEVSA FM's agents run one booth from behind its counter. Pixel snow. Calm on purpose.
  Each stall is kept: an agent beside Access Granted's padlock, an elf scooping guacamole, an agent at localhost:210
  with a laptop (its lid to us, the DEVSA sticker on it). Once a loop an elf buys chips: walks in, hands over a coin,
  leaves with a basket. The houses' lit windows glow amber, a warm haze over the roofs. Walkers keep to the strip
  just below the counters, behind the luminarias, so the footer's corners stay clear. Seamless over fm.T. Footer: the DEVSA FM radio.
-->
<canvas id="c" width="1920" height="1080"></canvas>
<script src="plush.js"></script>
<script src="fmkit.js"></script>
<script src="xmas-sprites.js"></script>
<script>
const { W, H, TAU, CELL, TEAL, PINK, ORANGE, ctx, g, T, lerp, hash, glow, lit, footer } = fm
const GOLD = xs.GOLD
const PLAZA = 780                                 // where the houses meet the plaza
const BPM = (window.BEATS && window.BEATS.bpm) || 76, OFFSET = (window.BEATS && window.BEATS.offset) || 0
const beatPh = t => { const b = (t - OFFSET) * BPM / 60; return ((b % 1) + 1) % 1 }

// ---- 1. the world, in greys -----------------------------------------------------------------------
const HOUSES = [[40, 300, 360], [330, 230, 390], [600, 280, 345], [950, 250, 380], [1230, 290, 355], [1550, 330, 375]]   // [x, w, h]
function paint(t) {
  g.setTransform(1 / CELL, 0, 0, 1 / CELL, 0, 0)
  g.fillStyle = fm.gray(.02); g.fillRect(0, 0, W, H)
  for (let i = 0; i < 60; i++) {                     // stars, a whole number of twinkles a loop
    g.fillStyle = fm.gray(.25 + .2 * Math.sin(TAU * 3 * t / T + i)); g.fillRect(hash(i, 1) * W, hash(i, 2) * 300, CELL, CELL)
  }
  // the oak's canopy, behind and over the houses
  for (let i = 0; i < 40; i++) {
    const x = 300 + hash(i, 11) * 1300, y = 60 + hash(i, 12) * 220, r = 60 + hash(i, 13) * 100
    g.fillStyle = fm.gray(.08 + .06 * hash(i, 14)); g.beginPath(); g.ellipse(x, y, r, r * .55, 0, 0, TAU); g.fill()
  }
  g.fillStyle = fm.gray(.3); g.fillRect(905, 260, 40, PLAZA - 260)            // its trunk, between the houses
  // La Villita's houses: limestone, flat roofs with a parapet, deep-set doors and small windows
  HOUSES.forEach(([x, w, h], i) => {
    const top = PLAZA - h
    g.fillStyle = fm.gray(.5); g.fillRect(x, top, w, h)
    g.fillStyle = fm.gray(.62); g.fillRect(x - 8, top - 14, w + 16, 16)          // the parapet
    for (let k = 0; k < Math.floor(w / 24); k++) { g.fillStyle = fm.gray(.4); g.fillRect(x + 6 + k * 24, top + 30 + (k % 2) * 40, 12, 6) }   // the stone's courses
    const dx = x + w * .5 - 30
    g.fillStyle = fm.gray(.08); g.fillRect(dx, PLAZA - 130, 60, 130)            // the door, deep-set
    for (const wx of [x + 30, x + w - 80]) {
      const litWin = hash(i, wx) > .4
      g.fillStyle = fm.gray(litWin ? .8 : .1); g.fillRect(wx, top + 70, 48, 60)
      g.fillStyle = fm.gray(.65); g.fillRect(wx - 6, top + 130, 60, 8)          // the sill
    }
  })
  // the plaza: flagstones
  g.fillStyle = fm.gray(.2); g.fillRect(0, PLAZA, W, H - PLAZA)
  for (let y = PLAZA + 24; y < H; y += 36) for (let x = (y / 36 % 2) * 60; x < W; x += 120) { g.fillStyle = fm.gray(.32); g.fillRect(x, y, 100, 6) }
  g.setTransform(1, 0, 0, 1, 0, 0)
}

// the houses lit for the evening: amber in the windows that are lit, a soft warm glow where the oak meets the roofs
function warmHouses(t) {
  HOUSES.forEach(([x, w, h], i) => {
    const top = PLAZA - h
    for (const wx of [x + 30, x + w - 80]) {
      if (hash(i, wx) <= .4) continue
      const fl = .85 + .15 * Math.sin(TAU * 2 * t / T + i + wx)
      lit(() => glow(wx + 24, top + 100, 70, 60, `rgba(255,170,80,${(.28 * fl).toFixed(3)})`))
      ctx.fillStyle = `rgba(255,190,110,${(.45 * fl).toFixed(3)})`; ctx.fillRect(wx, top + 70, 48, 60)
      ctx.fillStyle = "rgba(60,30,10,.5)"; ctx.fillRect(wx + 22, top + 70, 4, 60); ctx.fillRect(wx, top + 98, 48, 4)    // the panes
    }
  })
  lit(() => { for (const [gx, gy] of [[300, 400], [760, 380], [1180, 390], [1640, 400]]) glow(gx, gy, 380, 120, "rgba(255,160,80,.07)") })
}
// ---- 3. in colour -------------------------------------------------------------------------------
const XL = [TEAL, PINK, ORANGE, GOLD, "#fff1d6"]
// string lights across the plaza, two criss-crossing swags, pulsing on the beat
function stringLights(t) {
  const beat = fm.pulseAt(t), swags = [[0, 230, W, 330, 120], [0, 330, W, 230, 110]]
  swags.forEach(([x0, y0, x1, y1, sag], si) => {
    const at = u => [lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(u * Math.PI) * sag]
    ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.lineWidth = 1.5; ctx.beginPath()
    for (let i = 0; i <= 40; i++) { const [x, y] = at(i / 40); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) } ctx.stroke()
    const n = Math.round((x1 - x0) / 46)
    for (let i = 1; i < n; i++) {
      const [x, y] = at(i / n), c = XL[(i + si) % XL.length], tw = .55 + .2 * Math.sin(TAU * 2 * t / T + i) + .25 * beat
      lit(() => glow(x, y + 6, 16, 16, fm.rgba(c, .4 * tw)))
      ctx.fillStyle = c; ctx.globalAlpha = Math.min(1, .55 + .45 * tw); ctx.beginPath(); ctx.arc(x, y + 6, 4.5, 0, TAU); ctx.fill(); ctx.globalAlpha = 1
    }
  })
}

// the stalls: [x, awning colour, goods]; the agents' booth is the third
// two of DEVSA's conferences, each in its own look (lib/event-brands.ts: Access Granted #00ff66, PySanAntonio #4a90d9
// with the Amador wordmark), localhost:210 (the open-data terminal, its wordmark on the cover) and chips & guac for the market's San Antonio snack
const AG = "#00ff66", MODEL = "#C0B4FC", PYSA_BLUE = "#4a90d9"
const STALLS = [[150, AG, "ag"], [560, PINK, "chips"], [1000, TEAL, "localhost"], [1440, PYSA_BLUE, "pysa"]]
const [PADLOCK, padReady] = fm.loadImg("padlock.png"), [PYWORD, pywReady] = fm.loadImg("wordmark-dark.svg"), [PYSTK, pystkReady] = fm.loadImg("mascot-sticker.webp")
// DEVSA's own: a booth for organizers (the organizers page), chips and guacamole (the City's chips and avocado
// icons), Give a talk (the agents taking turns at the mic) and localhost:210
const FOODICON = {}
const foodReady = Promise.all(["chips", "avocado"].map(n => fetch("icons/" + n + ".svg").then(r => r.ok ? r.text() : "", () => "").then(svg => {
  if (!/viewBox=/.test(svg)) return
  FOODICON[n] = ["#f0ece0", n === "chips" ? "#ffd343" : "#7fd67a"].map(c => { const im = new Image()
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/#231f20/gi, c).replace(/stroke-linecap/, "stroke-width: 1.4px; stroke-linecap")); return im })
  return Promise.all(FOODICON[n].map(im => new Promise(r => { im.onload = r; im.onerror = r })))
})))
// table-cover patterns: the City's icons, tinted, tiled faintly across each cloth
const PAT = {}
const patReady = Promise.all([["chips", PINK], ["guitar", "#4a90d9"], ["via", TEAL]].map(([n, c]) => fetch("icons/" + n + ".svg").then(r => r.ok ? r.text() : "", () => "").then(svg => new Promise(res => {
  if (!/viewBox=/.test(svg)) return res(); const im = new Image(); im.onload = () => { PAT[n] = im; res() }; im.onerror = res
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/#231f20|#000000|#000\b/gi, c).replace(/stroke-linecap/, "stroke-width: 1.6px; stroke-linecap")) }))))   // City icons stroke in #231f20 or #000
function pattern(n, x, y, w, h, alpha = .28) {
  const im = PAT[n]; if (!im) return
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.globalAlpha = alpha
  const s = 30, iw = s * im.naturalWidth / im.naturalHeight
  for (let r = 0, yy = y + 4; yy < y + h; r++, yy += s + 8) for (let xx = x + (r % 2 ? 20 : 2); xx < x + w; xx += iw + 22) ctx.drawImage(im, xx, yy, iw, s)
  ctx.restore()
}
const drawIcon = (n, k, x, y, h) => { const im = FOODICON[n] && FOODICON[n][k]; if (!im || !im.complete || !im.naturalWidth) return; const w = h * im.naturalWidth / im.naturalHeight; ctx.drawImage(im, x - w / 2, y - h / 2, w, h) }
const [STK, stkReady] = (() => { const ims = ["sticker-hello", "sticker-lgtm", "sticker-shipit", "sticker-love", "sticker-tower"].map(n => fm.loadImg(n + ".png")); return [ims.map(p => p[0]), Promise.all(ims.map(p => p[1]))] })()
const [LHWORD, lhReady] = fm.loadImg("localhost-210-wordmark-dark.svg")   // the localhost:210 wordmark (DEVSA branding, for dark grounds)
const [PENGUIN, penguinReady] = fm.loadImg("penguin.png"), [PYSA, pysaReady] = fm.loadImg("pysa-mascot-full.webp")
function tag(x, y, txt) {                            // a price tag in terminal type
  ctx.fillStyle = "#f4efe6"; ctx.beginPath(); ctx.moveTo(x, y + 10); ctx.lineTo(x + 10, y); ctx.lineTo(x + 66, y); ctx.lineTo(x + 66, y + 20); ctx.lineTo(x + 10, y + 20); ctx.closePath(); ctx.fill()
  ctx.fillStyle = "#07080c"; ctx.font = '700 13px "Geist Mono"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, x + 38, y + 11)
}
const SW = 340, COUNTER = 860, ATOP = 640
const ORN = [".##.", "####", "####", ".##."], CONCHA = [".####.", "#.##.#", "######", ".####."], CANDLE = [".G.", ".O.", "WWW", "WWW", "WWW", "WWW"]
// the stallkeepers: an agent at Access Granted beside the padlock, an elf scooping guacamole at the chips stall,
// an agent at localhost:210 with a laptop open on the counter (its lid to us, a DEVSA sticker on it). PySanAntonio
// keeps its mascot sticker on the counter and no one behind it.
const [DSTK, dstkReady] = fm.loadImg("devsa-window-sticker.png")
function vendor(x, goods, t) {
  const b = (0.5 - 0.5 * Math.cos(beatPh(t) * TAU)) * 3
  if (goods === "ag") drawPlush(ctx, { x: x + SW * .76, y: COUNTER + 40 - b, s: .9, tint: TEAL, number: "", t, seed: 21, look: -4 + 3 * Math.sin(t * .5), mouth: .35 })
  if (goods === "localhost") {
    drawPlush(ctx, { x: x + SW * .3, y: COUNTER + 40 - b, s: .9, tint: PINK, number: "", t, seed: 17, look: 5, mouth: .3 + .15 * Math.sin(t * 1.3) })
  }
  if (goods === "chips") {                           // an elf behind the bowl, scooping on the beat
    const px = 5, [w, h] = xs.size(xs.ELF, px), ex = x + 138 + 40, ey = COUNTER + 14 - h
    xs.spr(ctx, xs.ELF, { ...xs.PAL, E: ORANGE, S: SKINS[1][0], s: SKINS[1][1] }, ex - w / 2, ey, px)
    const sc = Math.max(0, Math.sin(beatPh(t) * TAU))        // the scoop: a chip dipping into the guacamole and back up
    ctx.fillStyle = "#ffd343"; ctx.save(); ctx.translate(ex - 34, COUNTER - 18 - sc * 16); ctx.rotate(-.4); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, -6); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill()
    if (sc > .2) { ctx.fillStyle = "#7fbf5a"; ctx.fillRect(9, -2, 5, 5) } ctx.restore()
  }
}
function laptop(x, t) {                              // on the localhost:210 counter, its lid toward us
  const lx = x + SW * .62, base = COUNTER - 2
  ctx.fillStyle = "#9aa0a8"; ctx.fillRect(lx - 46, base - 6, 92, 6)
  ctx.fillStyle = "#b9bec6"; ctx.beginPath(); ctx.roundRect(lx - 40, base - 62, 80, 56, 4); ctx.fill()
  lit(() => glow(lx, base - 60, 60, 20, "rgba(120,220,210,.25)"))                  // the screen's light, spilling over the lid's top edge
  if (DSTK.complete && DSTK.naturalWidth) { const h = 30, w = h * DSTK.naturalWidth / DSTK.naturalHeight; ctx.drawImage(DSTK, lx - w / 2, base - 50, w, h) }
}
function stall(x, col, goods, t) {
  // posts and the counter
  ctx.fillStyle = "#3a2a1c"; ctx.fillRect(x + 8, ATOP, 10, COUNTER - ATOP + 60); ctx.fillRect(x + SW - 18, ATOP, 10, COUNTER - ATOP + 60)
  vendor(x, goods, t)                                // whoever keeps the stall, behind its counter
  // the goods, behind the counter's front, on its top
  if (goods === "ag") {                              // Access Granted: its wordmark alone on the board, the padlock on the counter
    const bx = x + 34, by = ATOP + 22, bw = SW - 68
    ctx.fillStyle = "#0a0a0a"; ctx.fillRect(bx - 4, by - 4, bw + 8, 104); ctx.strokeStyle = AG; ctx.lineWidth = 2; ctx.strokeRect(bx - 4, by - 4, bw + 8, 104)
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = '700 34px "Oswald"'; ctx.letterSpacing = "1px"     // as the site writes it: ACCESS in green, GRANTED in white
    const aw = ctx.measureText("ACCESS ").width, wx = bx + bw / 2 - ctx.measureText("ACCESS GRANTED").width / 2
    ctx.fillStyle = AG; ctx.fillText("ACCESS", wx, by + 48)
    ctx.fillStyle = "#ffffff"; ctx.fillText("GRANTED", wx + aw, by + 48); ctx.letterSpacing = "0px"
    if (PADLOCK.complete && PADLOCK.naturalWidth) { const h = 76, w = h * PADLOCK.naturalWidth / PADLOCK.naturalHeight; ctx.drawImage(PADLOCK, x + SW / 2 - w / 2, COUNTER - h, w, h) }
  }
  if (goods === "model") {                           // The Model: THE in Geist Mono, MODEL in a lavender selection, on white
    const bx = x + 50, by = ATOP + 20, bw = SW - 100
    ctx.fillStyle = "#ffffff"; ctx.fillRect(bx, by, bw, 100)
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#09090B"; ctx.font = '700 34px "Geist Mono"'; ctx.fillText("THE", bx + 18, by + 32)
    ctx.fillStyle = MODEL; ctx.fillRect(bx + 16, by + 54, 122, 36); ctx.fillStyle = "#09090B"; ctx.fillText("MODEL", bx + 22, by + 73)
    ctx.fillStyle = "#09090B"; ctx.fillRect(bx + 140, by + 56, 3, 32)                       // the text cursor at the selection's end
    ;[[x + 90, MODEL, 0], [x + 260, PINK, .5]].forEach(([ax, tint, ph], i) => {             // DEVSA FM's agents run the AI booth
      const b = (0.5 - 0.5 * Math.cos(((beatPh(t) + ph) % 1) * TAU)) * 4
      drawPlush(ctx, { x: ax, y: COUNTER + 40 - b, s: .95, tint: i ? PINK : TEAL, number: "", t, seed: 5 + i * 4, look: 4 * Math.sin(t * .4 + i), mouth: .4 + .2 * Math.sin(t * .9 + i), armsUp: i === 1 && Math.sin(TAU * 4 * t / T) > .3 ? 1 : 0 })
    })
  }
  if (goods === "pysa") {                            // PySanAntonio: its Amador wordmark, the mascot's sticker on the counter (the original art)
    const bx = x + 30, by = ATOP + 22, bw = SW - 60
    ctx.fillStyle = "#0a0a0a"; ctx.fillRect(bx, by, bw, 96)
    if (PYWORD.complete && PYWORD.naturalWidth) { const w = bw - 30, h = w * 958 / 4066; ctx.drawImage(PYWORD, bx + 15, by + 48 - h / 2, w, h) }
    if (PYSTK.complete && PYSTK.naturalWidth) { const h = 120, w = h * PYSTK.naturalWidth / PYSTK.naturalHeight; ctx.drawImage(PYSTK, x + SW / 2 - w / 2, COUNTER - h + 6, w, h) }
  }
  if (goods === "chips") {                           // chips and guacamole: a chalk menu with the City's icons, baskets and bowls on the counter
    const bx = x + 40, by = ATOP + 24, bw = SW - 80
    ctx.fillStyle = "#6b4a2e"; ctx.fillRect(bx - 6, by - 6, bw + 12, 132); ctx.fillStyle = "#1f2a26"; ctx.fillRect(bx, by, bw, 120)
    drawIcon("chips", 0, bx + 60, by + 56, 70); drawIcon("avocado", 0, bx + bw - 60, by + 56, 78)
    ctx.fillStyle = "rgba(240,236,224,.9)"; ctx.font = '700 15px "Geist Mono"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.letterSpacing = "2px"
    ctx.fillText("CHIPS & GUAC", bx + bw / 2, by + 106); ctx.letterSpacing = "0px"
    for (let k = 0; k < 3; k++) {                    // on the counter: a basket of chips, a bowl of guac, a basket of chips
      const cx = x + 60 + k * 78
      if (k === 1) { ctx.fillStyle = "#e8e2d4"; ctx.beginPath(); ctx.ellipse(cx, COUNTER - 8, 30, 12, 0, 0, Math.PI); ctx.fill(); ctx.fillStyle = "#7fbf5a"; ctx.beginPath(); ctx.ellipse(cx, COUNTER - 10, 26, 7, 0, Math.PI, TAU); ctx.fill() }
      else { drawIcon("chips", 1, cx, COUNTER - 22, 40) }
    }
    tag(x + SW - 92, COUNTER - 30, "$2")
  }
  if (goods === "talk") {                            // Give a talk: an agent at the mic, another listening, a sign
    const bx = x + 40, by = ATOP + 24, bw = SW - 80
    ctx.fillStyle = "#6b4a2e"; ctx.fillRect(bx - 6, by - 6, bw + 12, 96); ctx.fillStyle = "#1f2a26"; ctx.fillRect(bx, by, bw, 84)
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "rgba(240,236,224,.92)"; ctx.font = '700 22px "Geist Mono"'; ctx.letterSpacing = "2px"
    ctx.fillText("GIVE A TALK", bx + bw / 2, by + 30); ctx.letterSpacing = "0px"
    ctx.font = '700 15px "Geist Mono"'; ctx.fillStyle = "rgba(255,170,190,.95)"; ctx.fillText("first talks welcome", bx + bw / 2, by + 62)
    const speak = Math.floor(((t - OFFSET) * BPM / 60) / 8 + 1e4) % 2                   // they take turns at the mic
    ;[[x + 100, TEAL, 0], [x + 250, PINK, .5]].forEach(([ax, tint, ph], i) => {
      const b = (0.5 - 0.5 * Math.cos(((beatPh(t) + ph) % 1) * TAU)) * 4, talking = i === speak
      drawPlush(ctx, { x: ax, y: COUNTER + 40 - b, s: 1.0, tint, number: "", t, seed: 5 + i * 4, look: talking ? 0 : (i ? -6 : 6), mouth: talking ? .3 + .5 * Math.abs(Math.sin(t * 9)) : .15, armsUp: talking && Math.sin(t * 2) > .6 ? 1 : 0 })
    })
    const mx = speak ? x + 250 : x + 100, mic = mx + (speak ? -38 : 38)               // the mic stand, in front of whoever is talking
    ctx.fillStyle = "#2a2a32"; ctx.fillRect(mic - 2, COUNTER - 70, 4, 70); ctx.fillStyle = "#555"; ctx.beginPath(); ctx.ellipse(mic, COUNTER - 74, 7, 10, 0, 0, TAU); ctx.fill()
    tag(x + SW - 74, ATOP + 130, "$0")
  }
  if (goods === "localhost") {                       // localhost:210: its wordmark on a dark board, like the other booths' marks
    const bx = x + 30, by = ATOP + 22, bw = SW - 60
    ctx.fillStyle = "#0a0a0a"; ctx.fillRect(bx, by, bw, 96)
    if (LHWORD.complete && LHWORD.naturalWidth) { const w = bw - 40, h = w * 198 / 1548; ctx.drawImage(LHWORD, bx + 20, by + 48 - h / 2, w, h) }
    laptop(x, t)
    tag(x + SW - 92, COUNTER - 30, "free")
  }
  // the counter's front: wood, a gold edge
  ctx.fillStyle = "#5e3b24"; ctx.fillRect(x, COUNTER, SW, 70); ctx.fillStyle = GOLD; ctx.fillRect(x, COUNTER, SW, 5)
  ctx.fillStyle = "rgba(0,0,0,.25)"; for (let k = 1; k < 6; k++) ctx.fillRect(x + k * SW / 6, COUNTER + 8, 2, 60)
  // a table cover on every booth: a dark cloth draped over the counter, folds, a draped hem, a band in the
  // booth's colour, and its own print: the address, the wordmark, the City's icons
  ctx.fillStyle = "#101216"; ctx.fillRect(x - 6, COUNTER - 2, SW + 12, 74)
  ctx.beginPath(); for (let k = 0; k <= 12; k++) ctx.lineTo(x - 6 + k * (SW + 12) / 12, COUNTER + 72 + (k % 2 ? 8 : 0)); ctx.lineTo(x + SW + 6, COUNTER + 72); ctx.lineTo(x - 6, COUNTER + 72); ctx.fill()
  ctx.fillStyle = col; ctx.fillRect(x - 6, COUNTER - 2, SW + 12, 6)
  ctx.fillStyle = "rgba(255,255,255,.05)"; for (let k = 1; k < 6; k++) ctx.fillRect(x - 6 + k * (SW + 12) / 6, COUNTER + 4, 2, 66)
  if (goods === "chips") pattern("chips", x - 6, COUNTER + 4, SW + 12, 66)
  if (goods === "ag") { ctx.save(); ctx.globalAlpha = .18; ctx.strokeStyle = AG; ctx.lineWidth = 1                       // Access Granted's grid
    for (let gx = x - 6; gx < x + SW + 6; gx += 18) { ctx.beginPath(); ctx.moveTo(gx, COUNTER + 4); ctx.lineTo(gx, COUNTER + 72); ctx.stroke() }
    for (let gy = COUNTER + 8; gy < COUNTER + 72; gy += 18) { ctx.beginPath(); ctx.moveTo(x - 6, gy); ctx.lineTo(x + SW + 6, gy); ctx.stroke() } ctx.restore() }
  if (goods === "model") { ctx.save(); ctx.globalAlpha = .22; ctx.fillStyle = MODEL; for (let r = 0; r < 4; r++) for (let c = 0; c < 14; c++) if ((r + c) % 2) ctx.fillRect(x + c * 25, COUNTER + 8 + r * 16, 10, 6); ctx.restore() }
  if (goods === "pysa") pattern("guitar", x - 6, COUNTER + 4, SW + 12, 66)
  if (goods === "localhost") pattern("via", x - 6, COUNTER + 4, SW + 12, 66, .45)          // the City's VIA bus: one of localhost:210's sources
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#f4efe6"; ctx.shadowColor = "#101216"; ctx.shadowBlur = 10
  ctx.font = '900 30px "Geist"'; ctx.letterSpacing = "4px"
  // no words on the covers: each booth carries its own mark above the counter
  ctx.letterSpacing = "0px"; ctx.shadowBlur = 0
  // Christmas on every table: a pine garland swagged along the cover's top, ornaments in the tab colours and gold
  for (let k = 0; k < 4; k++) {
    const x0 = x - 6 + k * (SW + 12) / 4, x1 = x0 + (SW + 12) / 4
    for (let u = 0; u <= 1.001; u += .04) { const gx = lerp(x0, x1, u), gy = COUNTER + 2 + Math.sin(Math.PI * u) * 7
      ctx.fillStyle = (Math.round(u * 25) + k) % 3 ? "#1f7a41" : "#2fa65a"; ctx.fillRect(gx - 5, gy - 5, 10, 10) }
    const ox = (x0 + x1) / 2, oy = COUNTER + 10, oc = [TEAL, PINK, ORANGE, GOLD][k]
    ctx.fillStyle = GOLD; ctx.fillRect(ox - 3, oy - 4, 6, 4); ctx.fillStyle = oc; ctx.beginPath(); ctx.arc(ox, oy + 6, 7, 0, TAU); ctx.fill()
    ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillRect(ox - 4, oy + 2, 3, 3)
  }
  // the awning: stripes in the stall's colour and white, a scalloped edge, gold trim
  for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? "#f4efe6" : col; ctx.fillRect(x - 10 + k * (SW + 20) / 8, ATOP - 46, (SW + 20) / 8, 46) }
  for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? "#f4efe6" : col; ctx.beginPath(); ctx.arc(x - 10 + (k + .5) * (SW + 20) / 8, ATOP, (SW + 20) / 16, 0, Math.PI); ctx.fill() }
  ctx.fillStyle = GOLD; ctx.fillRect(x - 12, ATOP - 50, SW + 24, 6)
  { const wx = x + SW / 2, wy = ATOP - 72                   // a small wreath over each booth, a red bow at its foot
    for (let a = 0; a < 16; a++) { const ang = a / 16 * TAU; ctx.fillStyle = a % 3 ? "#1f7a41" : "#2fa65a"; ctx.fillRect(wx + Math.cos(ang) * 16 - 4, wy + Math.sin(ang) * 16 - 4, 8, 8) }
    ctx.fillStyle = "#d8343c"; ctx.fillRect(wx - 8, wy + 12, 6, 6); ctx.fillRect(wx + 2, wy + 12, 6, 6); ctx.fillRect(wx - 2, wy + 14, 4, 4)
    lit(() => glow(wx, wy, 24, 24, "rgba(255,200,120,.15)")) }
  // warm light from inside the stall
  lit(() => glow(x + SW / 2, COUNTER - 30, 200, 80, "rgba(255,190,110,.12)"))
}
// papel picado strung between the stalls' awnings
function papel(t) {
  for (let s = 0; s < STALLS.length - 1; s++) {
    const x0 = STALLS[s][0] + SW + 12, x1 = STALLS[s + 1][0] - 12, n = 3
    for (let k = 0; k < n; k++) {
      const x = lerp(x0, x1, (k + .5) / n) - 18, y = ATOP - 40 + Math.sin(Math.PI * (k + .5) / n) * 16, sw = Math.sin(TAU * 2 * t / T + k + s) * .06
      ctx.save(); ctx.translate(x + 18, y); ctx.rotate(sw); ctx.fillStyle = [PINK, TEAL, ORANGE, GOLD][(k + s) % 4]; ctx.fillRect(-18, 0, 36, 44)
      const CUT = ["#......", ".#.....", "..#....", ".#.....", "#......", "...####"]                 // DEVSA's >_ cut through the paper
      ctx.fillStyle = "#07080c"; CUT.forEach((row, r) => [...row].forEach((ch, q) => { if (ch === "#") ctx.fillRect(-14 + q * 4, 10 + r * 4, 4, 4) }))
      for (let z = -18; z < 18; z += 6) { ctx.beginPath(); ctx.moveTo(z, 44); ctx.lineTo(z + 3, 38); ctx.lineTo(z + 6, 44); ctx.fill() }   // the zigzag hem
      ctx.restore()
    }
  }
}
// luminarias along the front of the plaza
function luminarias(t) {
  for (let i = 0; i < 11; i++) {                     // between the footer's two corners
    const x = 210 + i * 116, y = 1000, fl = .8 + .2 * Math.sin(TAU * (3 + i % 3) * t / T + i)
    lit(() => glow(x + 14, y - 14, 40, 30, `rgba(255,190,100,${(.35 * fl).toFixed(3)})`))
    ctx.fillStyle = "#c9a26a"; ctx.fillRect(x, y - 30, 28, 30); ctx.fillStyle = `rgba(255,214,140,${(.6 * fl).toFixed(3)})`; ctx.fillRect(x + 8, y - 22, 12, 14)
  }
}
// elves strolling the plaza, a whole number of crossings a loop, some carrying gifts
const SKINS = [["#f2cfae", "#d9ab86"], ["#c2875a", "#a06c44"], ["#6e4428", "#55331e"], ["#e0a87e", "#c48a60"], ["#9a6440", "#7c4e30"]]
const ELVES = [[1, .05, TEAL, 0, 0], [1, .38, PINK, 2, 3], [-1, .2, ORANGE, 1, -1], [-1, .7, TEAL, 4, 2], [1, .78, PINK, 3, -1]]   // [dir, phase, tunic, skin, gift]
function elves(t) {
  ELVES.forEach(([dir, ph, c, sk, gift], i) => {
    const u = ((t / T) + ph) % 1, x = dir > 0 ? lerp(-80, W + 80, u) : lerp(W + 80, -80, u), y = 972 + (i % 2) * 6, px = 5   // just below the counters, behind the luminarias, so the footer's edge stays clear
    const step = Math.floor(beatPh(t) * 2 + i) % 2, [w, h] = xs.size(xs.ELF, px)
    xs.spr(ctx, step ? xs.ELF_STEP : xs.ELF, { ...xs.PAL, E: c, S: SKINS[sk][0], s: SKINS[sk][1] }, x - w / 2, y - h, px, { flip: dir < 0 })
    if (gift >= 0) { const [gw, gh] = xs.size(xs.GIFT, 3); xs.spr(ctx, xs.GIFT, { ...xs.PAL, ...xs.WRAPS[gift] }, x - gw / 2, y - h * .45, 3) }
  })
}
// once a loop an elf walks in, stops at the chips stall, hands over a coin, and walks off with a basket of chips
const BUY = { t0: 24, in: 10, stop: 4.5, out: 12, at: 560 + SW / 2 + 20, y: 976 }
function buyer(t) {
  const u = t - BUY.t0, { in: tin, stop, out } = BUY; if (u < 0 || u > tin + stop + out) return
  const walkIn = u < tin, paused = u >= tin && u < tin + stop, x = walkIn ? lerp(-80, BUY.at, u / tin) : paused ? BUY.at : lerp(BUY.at, W + 80, (u - tin - stop) / out)
  const px = 5, step = paused ? 0 : Math.floor(beatPh(t) * 2) % 2, [w, h] = xs.size(xs.ELF, px), top = BUY.y - h
  xs.spr(ctx, step ? xs.ELF_STEP : xs.ELF, { ...xs.PAL, E: PINK, S: SKINS[3][0], s: SKINS[3][1] }, x - w / 2, top, px)
  if (paused && u - tin < 1.6) { const k = (u - tin) / 1.6; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x + 20 + k * 10, top + 40 - k * 60, 6, 0, TAU); ctx.fill() }   // the coin, handed up
  if (u - tin > 2) drawIcon("chips", 1, x + 26, top + 56, 34)                                                                    // the basket of chips, carried off
}
// an A-frame chalkboard on the plaza between the stalls
function chalkboard() {
  const x = 906, y = 846, w = 88                     // in the gap between the second and third stalls
  ctx.fillStyle = "#6b4a2e"; ctx.fillRect(x - 4, y - 4, w + 8, 96); ctx.fillStyle = "#1f2a26"; ctx.fillRect(x, y, w, 88)
  ctx.strokeStyle = "#6b4a2e"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + 8, y + 88); ctx.lineTo(x - 2, y + 116); ctx.moveTo(x + w - 8, y + 88); ctx.lineTo(x + w + 2, y + 116); ctx.stroke()
  ctx.fillStyle = "rgba(240,236,224,.9)"; ctx.font = '700 13px "Geist Mono"'; ctx.textAlign = "center"; ctx.textBaseline = "middle"
  ctx.fillText("YOUR SEAT", x + w / 2, y + 24); ctx.fillText("IS OPEN", x + w / 2, y + 44); ctx.fillStyle = "rgba(255,120,150,.9)"; ctx.fillText(">_", x + w / 2, y + 66)
}
// the penguin and the PySA mascot, browsing the stalls with the elves (the original images)
function shoppers(t) {
  const gait = TAU * BPM / 60 * (t - OFFSET)
  // (the PySA mascot is at its own booth now)
  ;[[PENGUIN, 110, .15, 1, true]].forEach(([im, h, ph, dir, crisp], i) => {
    if (!im.complete || !im.naturalWidth) return
    const u = ((t / T) + ph) % 1, x = dir > 0 ? lerp(-120, W + 120, u) : lerp(W + 120, -120, u), w = h * im.naturalWidth / im.naturalHeight, bob = Math.abs(Math.sin(gait + i)) * 3
    ctx.imageSmoothingEnabled = !crisp; ctx.drawImage(im, x - w / 2, 978 - h - bob, w, h); ctx.imageSmoothingEnabled = true
  })
}
// pixel snow: the desk's six-armed flake and specks, seamless
const FLAKE = ["...#...", "#..#..#", ".#.#.#.", "..###..", "#######", "..###..", ".#.#.#.", "#..#..#", "...#..."]
const FLAKES = Array.from({ length: 60 }, (_, i) => { const kind = i % 10 < 6 ? 0 : i % 10 < 9 ? 1 : 2
  return { x: hash(i, 31) * W, ph: hash(i, 32), laps: kind === 2 ? 1 : 2, sw: 10 + hash(i, 33) * 30, kind, px: [4, 2, 4][kind], a: [.5, .6, .85][kind] } })
function snow(t) {
  for (const f of FLAKES) {
    const h = f.kind ? 9 * f.px : f.px, k = ((t / T) * f.laps + f.ph) % 1, y = Math.round((-h + k * (H + 2 * h)) / f.px) * f.px
    const x = Math.round((f.x + Math.sin(TAU * f.laps * t / T + f.ph * 6) * f.sw) / f.px) * f.px
    ctx.fillStyle = `rgba(255,255,255,${f.a})`
    if (!f.kind) { ctx.fillRect(x, y, f.px, f.px); continue }
    FLAKE.forEach((row, ry) => [...row].forEach((c, rx) => { if (c === "#") ctx.fillRect(x + rx * f.px, y + ry * f.px, f.px, f.px) }))
  }
}
window.FOOTER_SPRITE = (x, bottom, t) => { xs.radio(ctx, x, bottom - xs.RADIO.length * 3, 3, beatPh(t) / 4 + Math.floor((t - OFFSET) * BPM / 60 % 4 + 4) % 4 / 4); return 26 * 3 }

function render(t) {
  paint(t)
  fm.ascii("#07080c")
  warmHouses(t)
  stringLights(t)
  STALLS.forEach(([x, c, goods]) => stall(x, c, goods, t))
  papel(t)
  shoppers(t)
  elves(t)
  buyer(t)
  luminarias(t)
  snow(t)
  footer(t)
}
fm.start(render, [dstkReady, stkReady, penguinReady, pysaReady, foodReady, lhReady, patReady, padReady, pywReady, pystkReady, document.fonts.load('700 20px "Oswald"')])
</script>
